name: Build FlipScout APK
on:
  workflow_dispatch:
  push:
    branches: [main]
# the GitHub token here can only read the code (it never needs to change the repository)
permissions:
  contents: read
jobs:
  build:
    # GitHub's own add-ons are pinned to exact commits (the version each v4 tag pointed to on 11 Nov 2026, signed by GitHub),
    # so they can't change unseen while the signing key is on this machine; tests/signing-guard.test.mjs checks this
    # safety lock: runs for main, or for the testing branch ONLY when started by hand (its file is named as a testing build).
    # Nothing here installs, deploys or publishes: it only makes a downloadable file.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/testing')
    name: ${{ matrix.variant == 'live' && 'build' || matrix.variant }}
    strategy:
      matrix:
        variant: ${{ fromJSON(github.ref == 'refs/heads/claude/capacitor-8-upgrade' && '["cap8-update-test","cap6-rollback-test"]' || '["live"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run all tests (nothing is uploaded if any fail)
        run: node tests/run-all.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.variant == 'cap6-rollback-test' && '17' || '21' }}
      - name: Prepare app
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir www
          cp index.html www/index.html
          # version = 2.0.<build number>, shown in Settings and in the phone's App info, so you can tell which build is installed
          sed -i 's/VER="2.0"/VER="2.0.${{ github.run_number }}"/' www/index.html
          grep -c 'VER="2.0.${{ github.run_number }}"' www/index.html
          npm init -y
          # exact versions (checked for known problems in the test pipeline), so a new release can't change the app unseen.
          # Capacitor 8.6.0 (9 Nov 2026, testing only): clears the 5 npm audit warnings of 6.2.3; needs Java 21 and Node 22+;
          # Android 7.0+ (minSdk 24), targets Android 16 (API 36). Same app ID, signing key and web origin (https://localhost).
          if [ "${VARIANT:-}" != cap6-rollback-test ]; then
          npm install @capacitor/core@8.6.0 @capacitor/cli@8.6.0 @capacitor/android@8.6.0 @capacitor/app@8.1.2 @capacitor/push-notifications@8.1.3 @capacitor/app-launcher@8.0.1 cordova-plugin-inappbrowser@6.0.1
          else
          # ROLLBACK REHEARSAL ONLY (emulator): the same app code on the current live Capacitor 6.2.3 set, to prove going back keeps data
          npm install @capacitor/core@6.2.3 @capacitor/cli@6.2.3 @capacitor/android@6.2.3 @capacitor/app@6.0.3 @capacitor/push-notifications@6.0.5 @capacitor/app-launcher@6.0.4 cordova-plugin-inappbrowser@6.0.1
          fi
          npx cap init "FlipScout" com.reaverslegion.flipscout --web-dir www
          npx cap add android
          npx cap sync android
      - name: Icon and splash
        run: |
          # every icon size is made once and stored in android-res, so nothing is installed here (that install kept hanging)
          R=android/app/src/main/res
          mkdir -p $R/mipmap-anydpi-v26 $R/values $R/drawable $R/drawable-nodpi
          cp -r android-res/. $R/
          echo '<resources><color name="fs_bg">#1B201D</color></resources>' > $R/values/fs_colors.xml
          for n in ic_launcher ic_launcher_round; do
            echo '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/fs_bg"/><foreground android:drawable="@mipmap/fs_foreground"/></adaptive-icon>' > $R/mipmap-anydpi-v26/$n.xml
          done
          find $R -name 'splash*.png' -delete
          cp splash-logo.png $R/drawable-nodpi/splash_logo.png
          echo '<layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="@color/fs_bg"/><item><bitmap android:src="@drawable/splash_logo" android:gravity="center"/></item></layer-list>' > $R/drawable/splash.xml
          # stop the build if the icon or splash is missing, instead of shipping a plain app
          test -s $R/mipmap-xxxhdpi/ic_launcher.png && test -s $R/mipmap-xxxhdpi/fs_foreground.png && test -s $R/drawable-nodpi/splash_logo.png
          echo "Icon and splash OK"
          # FlipScout has its own light and dark themes: stop the phone forcing dark mode onto the app
          sed -i 's#</style>#<item name="android:forceDarkAllowed">false</item></style>#g' $R/values/styles.xml
          grep -c forceDarkAllowed $R/values/styles.xml
      - name: Notifications
        run: |
          R=android/app/src/main/res
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "Firebase config added"; else echo "No google-services.json yet: alerts will be off"; fi
          mkdir -p $R/drawable-xxxhdpi
          cp notif-icon.png $R/drawable-xxxhdpi/ic_stat_flipscout.png
          mkdir -p $R/values
          echo '<resources><color name="fs_accent">#83C99A</color></resources>' > $R/values/fs_notify.xml
          sed -i 's#</application>#<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_flipscout"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/fs_accent"/><meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="deals"/></application>#' android/app/src/main/AndroidManifest.xml
          grep -c ic_stat_flipscout android/app/src/main/AndroidManifest.xml
      - name: Crash capture
        run: |
          # FlipScout's own native crash capture (see android-native/): no accounts, reports go to your Scan service
          node android-native/add-crash-capture.mjs
      - name: Release settings
        run: |
          # a proper release build: not debuggable, web view not inspectable, nothing copied into Android/Google backups
          M=android/app/src/main/AndroidManifest.xml; R=android/app/src/main/res
          mkdir -p $R/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<data-extraction-rules><cloud-backup><exclude domain="root" path="."/><exclude domain="file" path="."/><exclude domain="database" path="."/><exclude domain="sharedpref" path="."/></cloud-backup><device-transfer><exclude domain="root" path="."/><exclude domain="file" path="."/><exclude domain="database" path="."/><exclude domain="sharedpref" path="."/></device-transfer></data-extraction-rules>' > $R/xml/data_extraction_rules.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<full-backup-content><exclude domain="root" path="."/><exclude domain="file" path="."/><exclude domain="database" path="."/><exclude domain="sharedpref" path="."/></full-backup-content>' > $R/xml/backup_rules.xml
          sed -i 's#android:allowBackup="true"#android:allowBackup="false" android:fullBackupContent="@xml/backup_rules" android:dataExtractionRules="@xml/data_extraction_rules"#' $M
          grep -c 'android:allowBackup="false"' $M
          node -e 'const f="android/app/src/main/assets/capacitor.config.json",fs=require("fs"),c=JSON.parse(fs.readFileSync(f,"utf8"));c.android={...(c.android||{}),webContentsDebuggingEnabled:false};fs.writeFileSync(f,JSON.stringify(c,null,2));console.log(JSON.stringify(c.android))'
          # signed with the SAME key as before (same file and name), so the installed app updates in place and keeps its data.
          # The passwords come from GitHub secrets when set; until then the key's existing password is used.
          cat >> android/app/build.gradle <<'EOF'
          android {
            signingConfigs { release { storeFile file('flipscout.keystore'); storePassword System.getenv('KS_PASS') ?: 'android'; keyAlias System.getenv('KS_ALIAS') ?: 'androiddebugkey'; keyPassword System.getenv('KS_KEY_PASS') ?: (System.getenv('KS_PASS') ?: 'android') } }
            buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
          }
          EOF
      - name: Signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KS" | base64 -d > android/app/flipscout.keystore
          test -s android/app/flipscout.keystore
          keytool -list -v -keystore android/app/flipscout.keystore -storepass "${KS_PASS:-android}" | grep SHA256
      - name: Version number
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "2.0.${{ github.run_number }}"/' android/app/build.gradle
          # emulator-only files: clearly named; the rollback is one number higher so Android accepts it over the Capacitor 8 one
          if [ "${VARIANT:-}" = cap8-update-test ]; then sed -i -E 's/versionName "([^"]*)"/versionName "\1-CAP8-EMULATOR-TEST"/' android/app/build.gradle; fi
          if [ "${VARIANT:-}" = cap6-rollback-test ]; then sed -i -E "s/versionCode [0-9]+/versionCode $((${{ github.run_number }}+1))/; s/versionName \"([^\"]*)\"/versionName \"\1.1-CAP6-ROLLBACK-TEST\"/" android/app/build.gradle; fi
          grep -E 'versionCode|versionName' android/app/build.gradle
      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KS_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../FlipScout.apk
      # the signing key file is deleted as soon as the app is built, even if a step failed or the run was stopped
      - name: Remove the signing key
        if: always()
        run: |
          rm -f android/app/flipscout.keystore
          test ! -e android/app/flipscout.keystore
          echo "signing key file removed from this machine"
      - if: matrix.variant == 'live'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'flipscout-apk' || 'flipscout-apk-TESTING-branch' }}
          path: FlipScout.apk
      # Capacitor 8 branch only: for the emulator update test, never for a phone; deleted by GitHub after 1 day
      - if: matrix.variant != 'live'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flipscout-apk-${{ matrix.variant }}-EMULATOR-ONLY
          path: FlipScout.apk
          retention-days: 1
