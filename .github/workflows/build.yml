name: Build FlipScout APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare app
        run: |
          mkdir www
          cp index.html www/index.html
          sed -i 's/Resell Helper · eBay UK/FlipScout/; s/<title>Resell Helper/<title>FlipScout/' www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "FlipScout" com.reaverslegion.flipscout --web-dir www
          npx cap add android
          npx cap sync android
      - name: Make icon
        continue-on-error: true
        run: |
          sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          mkdir -p $R/mipmap-anydpi-v26 $R/values
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            mkdir -p $R/mipmap-$1
            convert icon-1024.png -resize ${2}x${2} $R/mipmap-$1/ic_launcher.png
            cp $R/mipmap-$1/ic_launcher.png $R/mipmap-$1/ic_launcher_round.png
            convert icon-foreground.png -resize ${3}x${3} $R/mipmap-$1/fs_foreground.png
          done
          echo '<resources><color name="fs_bg">#0D172C</color></resources>' > $R/values/fs_colors.xml
          for n in ic_launcher ic_launcher_round; do
            echo '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/fs_bg"/><foreground android:drawable="@mipmap/fs_foreground"/></adaptive-icon>' > $R/mipmap-anydpi-v26/$n.xml
          done
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: flipscout-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
