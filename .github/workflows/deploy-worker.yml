name: Deploy Scan worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [worker.js, .github/workflows/deploy-worker.yml]
# Release B: the GitHub token here can only read the code (the deploy never changes the repository)
permissions:
  contents: read
jobs:
  deploy:
    # safety lock: the live deployment only runs from main, never from another branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run all tests (nothing is uploaded if any fail)
        run: node tests/run-all.mjs
      - name: Deploy worker with backup, hunting database and 5-minute schedule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCM_SA_B64: ${{ secrets.FCM_SA_B64 }}
        run: |
          # Release B: Cloudflare's tool pinned to 4.157.0 (version 3 has known high-severity problems in its parts); the same version
          # and the same commands (kv namespace list/create, d1 list --json, deploy, secret put) already deploy the test Scan service
          npm i -g wrangler@4.157.0
          pick() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const i=s.search(/^\[/m);const a=i<0?[]:JSON.parse(s.slice(i));const n=a.find(x=>(x.title||x.name||"").endsWith(process.argv[1]));console.log(n?(n.id||n.uuid):"")})' "$1"; }
          KV=$(wrangler kv namespace list | pick flipscout-backup)
          if [ -z "$KV" ]; then wrangler kv namespace create flipscout-backup; KV=$(wrangler kv namespace list | pick flipscout-backup); fi
          test -n "$KV"
          DB=$(wrangler d1 list --json | pick flipscout-db)
          if [ -z "$DB" ]; then wrangler d1 create flipscout-db; DB=$(wrangler d1 list --json | pick flipscout-db); fi
          test -n "$DB"
          cat > wrangler.toml <<TOML
          name = "flipscout-search"
          main = "worker.js"
          compatibility_date = "2024-09-23"
          keep_vars = true

          [[kv_namespaces]]
          binding = "BACKUP"
          id = "$KV"

          [[d1_databases]]
          binding = "DB"
          database_name = "flipscout-db"
          database_id = "$DB"

          [triggers]
          crons = ["* * * * *"]
          TOML
          cat wrangler.toml
          wrangler deploy
          if [ -n "$FCM_SA_B64" ]; then echo "$FCM_SA_B64" | base64 -d | wrangler secret put FCM_SA; echo "Alert key saved"; else echo "No alert key yet"; fi
