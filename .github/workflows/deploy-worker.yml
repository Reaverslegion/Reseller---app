name: Deploy Scan worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [worker.js]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker.js --name flipscout-search --compatibility-date 2024-09-23
