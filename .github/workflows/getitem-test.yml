# TEMPORARY test (owner approved 1 Nov 2026): does eBay's official Trading API (GetItem) return the upload time
# (ListingDetails.StartTime) for SOLD listings that belong to other sellers? Uses 130 sold item numbers FlipScout
# already has from fills. Reads the database only. Prints a summary, no seller names. Delete after the test.
name: GetItem upload-time test (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pick sold item numbers (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@3 >/dev/null 2>&1
          DB=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const i=s.search(/^\[/m);const a=JSON.parse(s.slice(i));console.log((a.find(x=>x.name==="flipscout-db")||{}).uuid||"")})')
          printf 'name="x"\ncompatibility_date="2024-09-23"\n[[d1_databases]]\nbinding="DB"\ndatabase_name="flipscout-db"\ndatabase_id="%s"\n' "$DB" > wrangler.toml
          NOW=$(($(date +%s)*1000))
          # 100 spread over the last 95 days (10 per age band) + 30 the stock check also saw for sale (to compare upload dates)
          wrangler d1 execute flipscout-db --remote --json --command "WITH x AS (SELECT id, at, price, NTILE(10) OVER (ORDER BY at) b FROM fillseen WHERE at > $NOW - 95*86400000), y AS (SELECT id, at, price, b, ROW_NUMBER() OVER (PARTITION BY b ORDER BY random()) r FROM x) SELECT id, at, price, NULL first_seen FROM y WHERE r <= 10" > a.json
          wrangler d1 execute flipscout-db --remote --json --command "SELECT f.id, f.at, f.price, l.first_seen FROM fillseen f JOIN listings l ON l.id = f.id WHERE l.type='BIN' ORDER BY random() LIMIT 30" > b.json
      - name: Ask eBay's Trading API (GetItem) for each
        env:
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
        run: |
          node - <<'JS'
          const fs = require("fs"), rows = f => { const s = fs.readFileSync(f, "utf8"); return JSON.parse(s.slice(s.search(/^\[/m)))[0].results; };
          const all = [...rows("a.json"), ...rows("b.json")], tok = process.env.EBAY_USER_TOKEN, DAY = 864e5, now = Date.now();
          if (!tok) { console.log("::error::EBAY_USER_TOKEN secret is missing"); process.exit(1); }
          const tag = (x, t) => { const m = x.match(new RegExp("<" + t + ">([^<]*)</" + t + ">")); return m ? m[1] : null; };
          const out = [];
          for (const r of all) {
            // OAuth user tokens (start "v^1.1") go in a header; older Auth'n'Auth tokens go in the request body
            const oauth = /^v\^1\.1/.test(tok), cred = oauth ? "" : `<RequesterCredentials><eBayAuthToken>${tok}</eBayAuthToken></RequesterCredentials>`;
            const body = `<?xml version="1.0" encoding="utf-8"?><GetItemRequest xmlns="urn:ebay:apis:eBLBaseComponents">${cred}<ItemID>${r.id}</ItemID><DetailLevel>ReturnAll</DetailLevel></GetItemRequest>`;
            let x = "";
            try { const res = await fetch("https://api.ebay.com/ws/api.dll", { method: "POST", body, headers: { ...(oauth ? { "X-EBAY-API-IAF-TOKEN": tok } : {}), "Content-Type": "text/xml", "X-EBAY-API-SITEID": "3", "X-EBAY-API-COMPATIBILITY-LEVEL": "1423", "X-EBAY-API-CALL-NAME": "GetItem" } }); x = await res.text(); }
            catch (e) { x = "<Ack>Failure</Ack><LongMessage>" + e.message + "</LongMessage>"; }
            const start = tag(x, "StartTime"), end = tag(x, "EndTime");
            out.push({ age: Math.floor((now - r.at) / DAY), ok: /<Ack>(Success|Warning)<\/Ack>/.test(x), err: tag(x, "ErrorCode"), msg: (tag(x, "LongMessage") || "").slice(0, 120),
              start: start ? Date.parse(start) : null, end: end ? Date.parse(end) : null, sold: r.at, seen: r.first_seen, type: tag(x, "ListingType"), status: tag(x, "ListingStatus"), qty: tag(x, "QuantitySold") });
            await new Promise(s => setTimeout(s, 300));
          }
          const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "-";
          const bands = [[0, 15], [15, 30], [30, 60], [60, 96]].map(([a, b]) => { const g = out.filter(o => o.age >= a && o.age < b); return `${a}-${b} days ago: ${g.filter(o => o.start).length}/${g.length} with upload time`; });
          const cmp = out.filter(o => o.start && o.seen), same = cmp.filter(o => Math.abs(o.start - o.seen) < 2 * 3600e3);
          const days = out.filter(o => o.start && o.sold >= o.start).map(o => (o.sold - o.start) / DAY).sort((a, b) => a - b);
          const errs = {}; out.filter(o => !o.ok).forEach(o => { const k = (o.err || "?") + " " + o.msg; errs[k] = (errs[k] || 0) + 1; });
          const lines = [`Asked: ${out.length}. Answered: ${out.filter(o => o.ok).length} (${pct(out.filter(o => o.ok).length, out.length)}). With upload time: ${out.filter(o => o.start).length} (${pct(out.filter(o => o.start).length, out.length)})`,
            ...bands, `Upload time matches FlipScout's stock-check date (within 2h): ${same.length}/${cmp.length}`,
            days.length ? `Days from upload to sale: median ${days[days.length >> 1].toFixed(1)}, range ${days[0].toFixed(1)}-${days[days.length - 1].toFixed(1)}` : "No upload-to-sale times",
            `Formats: ${JSON.stringify(out.reduce((a, o) => (o.type && (a[o.type] = (a[o.type] || 0) + 1), a), {}))}`,
            `Errors: ${JSON.stringify(errs)}`];
          for (const l of lines) console.log("::notice title=result::" + l);
          JS
