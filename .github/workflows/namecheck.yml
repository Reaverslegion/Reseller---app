# TEMPORARY helper for the separate ResaleRocket business (not part of FlipScout): checks which .com and .co.uk web addresses are free.
# Uses the official registry look-ups (RDAP). Remove when the business name is chosen.
name: Name checker (temporary)
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Names, comma separated"
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check web addresses
        env:
          NAMES: ${{ inputs.names }}
        run: |
          node -e '
          const names=[...new Set(process.env.NAMES.split(",").map(s=>s.trim().toLowerCase().replace(/[^a-z0-9-]/g,"")).filter(Boolean))].slice(0,150);
          const look=async(u)=>{for(let i=0;i<3;i++){try{const r=await fetch(u,{headers:{accept:"application/rdap+json"}});if(r.status===404)return "free";if(r.ok)return "taken";}catch(e){}await new Promise(r=>setTimeout(r,1500))}return "?"};
          (async()=>{const out=[];for(const n of names){const com=await look("https://rdap.verisign.com/com/v1/domain/"+n+".com");const uk=await look("https://rdap.nominet.uk/uk/domain/"+n+".co.uk");out.push(n+":"+com+"/"+uk);await new Promise(r=>setTimeout(r,300))}
          const both=out.filter(x=>x.endsWith(":free/free")).map(x=>x.split(":")[0]);
          console.log("::notice title=both free::"+(both.join(", ")||"none"));
          for(let i=0;i<out.length;i+=60)console.log("::notice title=all "+(i/60+1)+"::"+out.slice(i,i+60).join(" "));})();
          '
