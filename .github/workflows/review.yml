# READ-ONLY review of the live Scan service database, for checking real deals and prices during development.
# Only queries that read (SELECT / WITH) are allowed; anything that could change data is refused before it runs.
# Results are saved as a private download on the run and deleted after 1 day. Remove this file before launch.
name: Review live data (read-only)
on:
  workflow_dispatch:
    inputs:
      sql:
        description: "A read-only query (SELECT ...)"
        required: true
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse anything that isn't read-only
        env:
          SQL: ${{ inputs.sql }}
        run: |
          node -e '
            const q = process.env.SQL.trim().replace(/;\s*$/, "");
            if (!/^(select|with)\b/i.test(q)) { console.error("Only SELECT or WITH queries are allowed."); process.exit(1); }
            if (/;/.test(q)) { console.error("One query only."); process.exit(1); }
            if (/\b(insert|update|delete|drop|alter|create|replace|pragma|attach|detach|vacuum|reindex|truncate)\b/i.test(q.replace(/'"'"'[^'"'"']*'"'"'/g, ""))) { console.error("That query could change data, so it was refused."); process.exit(1); }
            require("fs").writeFileSync("query.sql", q);
            console.log("Query accepted (read-only).");
          '
      - name: Run it on the live database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@4.157.0 >/dev/null 2>&1
          DB=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const i=s.search(/^\[/m);const a=i<0?[]:JSON.parse(s.slice(i));const n=a.find(x=>(x.name||"")==="flipscout-db");console.log(n?(n.uuid||n.id):"")})')
          test -n "$DB"
          printf 'name = "flipscout-review"\ncompatibility_date = "2024-09-23"\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "flipscout-db"\ndatabase_id = "%s"\n' "$DB" > wrangler.toml
          wrangler d1 execute flipscout-db --remote --json --command "$(cat query.sql)" > out.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("out.json","utf8"));console.log("Rows returned:",(r[0]&&r[0].results||[]).length)'
      # results are passed back as compressed notes on the run (readable through GitHub's API), not stored in the project.
      # GitHub keeps 4,096 characters per note and 10 notes per step, so the result is split over up to 5 steps (about 200 KB).
      - name: Pack results
        run: |
          node -e '
            const z=require("zlib"),fs=require("fs");
            const b=z.gzipSync(fs.readFileSync("out.json"),{level:9}).toString("base64"),N=4000,parts=Math.ceil(b.length/N);
            if(parts>50){console.log("::error::Result too big ("+parts+" parts). Narrow the query.");process.exit(1)}
            fs.writeFileSync("parts.json",JSON.stringify(Array.from({length:parts},(_,i)=>b.slice(i*N,(i+1)*N))));
          '
      - name: Hand back 1
        run: node -e 'const p=JSON.parse(require("fs").readFileSync("parts.json","utf8"));for(let i=0;i<Math.min(p.length,10);i++)console.log("::notice title=part "+(i+1)+" of "+p.length+"::"+p[i])'
      - name: Hand back 2
        run: node -e 'const p=JSON.parse(require("fs").readFileSync("parts.json","utf8"));for(let i=10;i<Math.min(p.length,20);i++)console.log("::notice title=part "+(i+1)+" of "+p.length+"::"+p[i])'
      - name: Hand back 3
        run: node -e 'const p=JSON.parse(require("fs").readFileSync("parts.json","utf8"));for(let i=20;i<Math.min(p.length,30);i++)console.log("::notice title=part "+(i+1)+" of "+p.length+"::"+p[i])'
      - name: Hand back 4
        run: node -e 'const p=JSON.parse(require("fs").readFileSync("parts.json","utf8"));for(let i=30;i<Math.min(p.length,40);i++)console.log("::notice title=part "+(i+1)+" of "+p.length+"::"+p[i])'
      - name: Hand back 5
        run: node -e 'const p=JSON.parse(require("fs").readFileSync("parts.json","utf8"));for(let i=40;i<Math.min(p.length,50);i++)console.log("::notice title=part "+(i+1)+" of "+p.length+"::"+p[i])'
