name: Update test (emulator only, no live access)
# Checks that the testing-branch build of your EXISTING FlipScout installs as an UPDATE over the previous build and keeps
# every piece of information, then checks it against a private LOCAL copy of your current live Scan service code
# (main's worker.js, fake eBay, no real keys, nothing deployed), and tests backup and restore. Emulator only.
# Started by changing .github/update-test/request.txt on the testing branch: "old=<build run id> new=<build run id>".
on:
  push:
    branches: [testing]
    paths: [".github/update-test/request.txt"]
permissions:
  contents: read
  actions: read
jobs:
  update:
    name: Update over the previous version + current Scan service + backup/restore
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the previous build (main) and the new build (testing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e; R=.github/update-test/request.txt
          OLD=$(grep -o 'old=[0-9]*' $R | cut -d= -f2); NEW=$(grep -o 'new=[0-9]*' $R | cut -d= -f2)
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$OLD --jq .head_branch)" = main
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$NEW --jq .head_branch)" = testing
          echo "previous: build #$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$OLD --jq .run_number) (main, $(gh api repos/$GITHUB_REPOSITORY/actions/runs/$OLD --jq .head_sha | cut -c1-7))"
          echo "new: build #$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$NEW --jq .run_number) (testing, $(gh api repos/$GITHUB_REPOSITORY/actions/runs/$NEW --jq .head_sha | cut -c1-7))"
          gh run download $OLD -n flipscout-apk -D old; gh run download $NEW -n flipscout-apk-TESTING-branch -D new
          for d in old new; do ls -la $d; f=$(find $d -name "*.apk" | head -1); test -n "$f"; [ "$f" = "$d/FlipScout.apk" ] || mv "$f" $d/FlipScout.apk; done
          echo "NEW_RUN=$NEW" >> $GITHUB_ENV
      - name: Same app ID and same signing certificate (read from the two files)
        run: |
          set -e; BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in old new; do
            B=$($BT/aapt2 dump badging $f/FlipScout.apk | head -1)
            C=$($BT/apksigner verify --print-certs $f/FlipScout.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
            echo "$f: $B | certificate SHA-256 $C | file SHA-256 $(sha256sum $f/FlipScout.apk | cut -d' ' -f1)"
            echo "$B" | grep -o "package: name='[^']*'" | cut -d"'" -f2 > $f.pkg; echo "$C" > $f.cert; echo "$B" | grep -o "versionCode='[0-9]*'" | grep -o "[0-9]*" > $f.ver
          done
          old_P=$(cat old.pkg); new_P=$(cat new.pkg); old_C=$(cat old.cert); new_C=$(cat new.cert); old_V=$(cat old.ver); new_V=$(cat new.ver)
          mkdir -p results
          node -e 'const [op,np,oc,nc,ov,nv]=process.argv.slice(1);const rows=[
            {area:"Update test",name:"same app ID as your app (com.reaverslegion.flipscout)",status:op===np&&np==="com.reaverslegion.flipscout"?"PASS":"FAIL",detail:`${op} → ${np}`},
            {area:"Update test",name:"signed with the same certificate as the previous build (your existing key)",status:oc&&oc===nc?"PASS":"FAIL",detail:`certificate SHA-256 starts ${nc.slice(0,16)}…`},
            {area:"Update test",name:"higher version number, so Android treats it as an update",status:+nv>+ov?"PASS":"FAIL",detail:`${ov} → ${nv}`}];
            require("fs").writeFileSync("results/update-identity.json",JSON.stringify(rows,null,1));console.log(rows.map(r=>r.status+" "+r.name+" — "+r.detail).join("\n"));process.exit(rows.some(r=>r.status==="FAIL")?1:0)' "$old_P" "$new_P" "$old_C" "$new_C" "$old_V" "$new_V"
      - name: Private local copy of your CURRENT live Scan service code (main's worker.js; fake eBay; no real keys; nothing deployed)
        run: |
          git show origin/main:worker.js > worker.js
          echo "worker.js here is main's (live) version: $(git rev-parse --short origin/main)"
          KEY=$(openssl rand -hex 24); echo "::add-mask::$KEY"; echo "TEST_APP_KEY=$KEY" >> $GITHUB_ENV
          TEST_APP_KEY=$KEY bash tests/e2e/start-test-service.sh
      - name: Free disk space for the emulator (removes unused tools on GitHub's machine only)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift /usr/local/lib/android/sdk/ndk || true
          df -h / | tail -1
      - name: Let the emulator use hardware speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: On the emulator - update over the previous version, current Scan service, backup and restore
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          disk-size: 4096M
          ram-size: 3072M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: OLD_APK=old/FlipScout.apk NEW_APK=new/FlipScout.apk node tests/android/update.mjs
      - name: Results
        if: always()
        run: |
          node -e 'const fs=require("fs");let rows=[];for(const f of fs.readdirSync("results").filter(f=>f.endsWith(".json")))rows=rows.concat(JSON.parse(fs.readFileSync("results/"+f)));
            const c={};for(const r of rows)c[r.status]=(c[r.status]||0)+1;console.log(JSON.stringify(c));for(const r of rows)console.log(r.status.padEnd(17),r.area,"|",r.name,r.detail?"— "+r.detail:"")' || true
          tail -5 service.out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-update-test
          path: |
            results/
            screenshots/
            logcat-update.txt
          retention-days: 14
