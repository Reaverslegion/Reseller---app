/* ---------- icons ---------- */
const I={
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h2M14 10h2M8 14h2M14 14h2M8 18h2M14 18h2"/></svg>',

deals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.5 8.5A2.5 2.5 0 0 0 10 10v2.5a3 3 0 0 1-1.5 3h7M8.5 12.5h4.5"/></svg>',
menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>',
bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>'};

/* ---------- state ---------- */
let S=load(),tab="deals",prev=[],F=loadDraft(),ED=null,SC={res:null,busy:false,msg:"",prog:""},UNDO=null,sheetOn=false,ob=0;
function load(){
  try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.rules){
    const old=x.rules.seller==null,rules={...DEF.rules,...x.rules};
    if(old&&Math.abs(rules.feeFixed-0.3)<1e-9)rules.feeFixed=0.40;
    if(!rules.v2){if(rules.minProfit===15)rules.minProfit=20;if(rules.minRoi===30)rules.minRoi=0;rules.v2=1;window._rulesNew=1}
    const items=(x.items||[]).map(i=>({...i,status:OLDMAP[i.status]||i.status}));
    return{rules,gate:x.gate||[],items,base:x.base||[],hunt:x.hunt||null,set:{...DEF.set,...x.set},expenses:Array.isArray(x.expenses)?x.expenses:[]}}}catch(e){}
  return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Couldn't save on this phone.")}cloudSoon()}
/* ---------- automatic cloud backup (to your Scan service) ---------- */
const CAKEY="flipscout_cloud_at";let cbT=null,cloudErr="",cloudLast="";
// "Back up now" feedback: busy while saving, success only after the Scan service confirms, a clear failure with retry, a
// 20-second limit so a stalled connection can't leave it waiting for ever, and a status line that TalkBack reads out
let BKUP={busy:false,msg:"",ok:null};const BK_MS=20000;
async function backupNow(){
  if(BKUP.busy)return;
  if(!connected()){BKUP={busy:false,ok:false,msg:"Backup failed: not connected to your Scan service."};bkShow();return}
  BKUP={busy:true,ok:null,msg:"Backing up…"};bkShow();
  let ok=false;try{ok=await cloudPush(true)}catch(e){ok=false}
  BKUP={busy:false,ok,msg:ok?"Backed up at "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+".":"Backup failed: "+(cloudErr||"unknown problem")+". Tap Try again."};bkShow()}
function bkShow(){const b=$("bk_now"),s=$("bk_st");if(b){b.disabled=BKUP.busy;b.setAttribute("aria-busy",BKUP.busy?"true":"false");b.textContent=BKUP.busy?"Backing up…":BKUP.ok===false?"Try again":"Back up now"}
  if(s)s.textContent=BKUP.msg}
const connected=()=>!!(S.set.url&&S.set.key);
// every call to your Scan service: the key goes in a hidden header, not in the web address (addresses end up in logs)
const kfetch=(url,key,qs,o)=>{o=o||{};return fetch(`${url}?${qs}`,{...o,headers:{...(o.headers||{}),"X-FlipScout-Key":String(key||"")}})};
const cloudAt=()=>{try{return+localStorage.getItem(CAKEY)||0}catch(e){return 0}};
function cloudSoon(){clearTimeout(cbT);if(connected())cbT=setTimeout(cloudPush,4000)}
async function cloudPush(manual){
  if(!connected())return false;
  if(!manual&&!S.items.length&&!S.base.length&&!(H().cats||[]).length)return false; // a brand-new, empty app never overwrites your backup
  // skip the upload when nothing has changed since the last good backup (saves the Scan service's daily storage writes)
  const body=JSON.stringify(S);if(!manual&&body===cloudLast)return true;
  // a phone that has never backed up or restored here must not silently replace a fuller cloud backup (e.g. after
  // "Not now" on the restore offer): it waits until you restore, or tap Back up now on purpose
  if(!manual&&!localStorage.getItem(CAKEY)){try{const r0=await kfetch(S.set.url,S.set.key,"backup=1"),c=await r0.json();
    const ci=c&&c.data&&Array.isArray(c.data.items)?c.data.items.length:0,cb=c&&c.data&&Array.isArray(c.data.base)?c.data.base.length:0;
    if(ci+cb>S.items.length+S.base.length){cloudErr="your cloud backup has more saved items than this phone; Restore from cloud, or tap Back up now to replace it";if(tab==="settings")render();return false}}catch(e){}}
  // only "Back up now" has a time limit (automatic backups behave exactly as before)
  const ac=manual&&typeof AbortController!=="undefined"?new AbortController():null,tm=ac?setTimeout(()=>ac.abort(),BK_MS):null;
  try{const r=await kfetch(S.set.url,S.set.key,"backup=1",{method:"POST",headers:{"Content-Type":"text/plain"},body,...(ac?{signal:ac.signal}:{})});const d=await r.json().catch(e=>{if(e&&e.name==="AbortError")throw e;return{}});
    if(!r.ok||d.error)throw new Error(d.error||"error "+r.status);
    cloudLast=body;localStorage.setItem(CAKEY,String(Date.now()));cloudErr="";if(manual)toast("Backed up.");if(tab==="settings"&&!(document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)))render();return true}
  catch(e){cloudErr=e&&e.name==="AbortError"?"no answer from your Scan service within 20 seconds (it may not have saved)":e.message==="Failed to fetch"?"no connection":e.message;if(manual)toast("Backup failed: "+cloudErr);return false}
  finally{if(tm)clearTimeout(tm)}
}
async function cloudCheck(silentIfNone){
  if(!connected())return;
  if(silentIfNone){try{localStorage.setItem("flipscout_restore_asked","1")}catch(e){}}
  try{const r=await kfetch(S.set.url,S.set.key,"backup=1"),d=await r.json();
    if(d.error)throw new Error(d.error);
    if(d.none||!d.data||!Array.isArray(d.data.items)){if(!silentIfNone)toast("No cloud backup yet.");return}
    if(!d.data.rules||typeof d.data.rules!=="object"){if(!silentIfNone)toast("The cloud backup looks incomplete, so it wasn't restored.");return}
    window._cb=d.data;const n=d.data.items.length,t=(d.data.base||[]).length,when=d.at?new Date(d.at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"recently";
    openSheet(`<h2 style="margin-top:0">Restore your data?</h2><div class="mu">Found a cloud backup from <b>${when}</b> ${n||t?`with ${n} deal/stock item${n===1?"":"s"} and ${t} tracked item${t===1?"":"s"}.`:"with your settings only (no saved deals or stock)."}</div><div class="btns"><button onclick="cloudRestore()">Restore it</button><button class="s" onclick="closeSheet()">Not now</button></div>`);
  }catch(e){if(!silentIfNone)toast("Couldn't check: "+(e.message==="Failed to fetch"?"no connection":e.message))}
}
function cloudRestore(){
  const x=window._cb;if(!x)return;const keep=JSON.stringify(S),conn={url:S.set.url,key:S.set.key};
  localStorage.setItem(KEY,JSON.stringify(x));S=load();S.set.url=S.set.url||conn.url;S.set.key=S.set.key||conn.key;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  try{localStorage.setItem(CAKEY,String(Date.now()))}catch(e){}cloudLast=JSON.stringify(S);
  closeSheet();tab="deals";prev=[];render();toast("Restored.","Undo",()=>{localStorage.setItem(KEY,keep);S=load();save();pushConfig();render()});
}
function loadDraft(){try{return{...BLANK,...JSON.parse(localStorage.getItem(DKEY)||"{}")}}catch(e){return{...BLANK}}}
function saveDraft(){try{localStorage.setItem(DKEY,JSON.stringify(F))}catch(e){}}

/* ---------- helpers ---------- */
// one shared number formatter each (making a new one for every £ figure took ~0.7 s for 1,500 deal cards on a phone)
const NF2=new Intl.NumberFormat("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}),NF0=new Intl.NumberFormat("en-GB");
const gbp=n=>(n<0?"-£":"£")+NF2.format(Math.abs(+n||0));
// estimates (what it sells for) in whole pounds: pence would suggest more precision than there is
const gbp0=n=>(n<0?"-£":"£")+NF0.format(Math.round(Math.abs(+n||0)));
// a money figure that may be missing: says "Unknown" (or the word given) instead of a made-up £0.00
const known=n=>n!=null&&n!==""&&Number.isFinite(+n),gbpK=(n,w="Unknown")=>known(n)?gbp(n):w,gbp0K=(n,w="Not available")=>known(n)?gbp0(n):w;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/[£,\s]/g,""));return isNaN(n)?0:n};
const isNum=v=>/^-?\d*\.?\d+$/.test(String(v).replace(/[£,\s]/g,""));
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const pct=(a,p)=>{const s=[...a].sort((x,y)=>x-y),i=(s.length-1)*p,l=Math.floor(i),h=Math.ceil(i);return s[l]+(s[h]-s[l])*(i-l)};
// only real web addresses become links (a link saved in a backup or typed in can't run code in the app)
const ukUrl=u=>{u=String(u||"").trim();return/^https?:\/\//i.test(u)?u.replace(/\/\/(www\.)?ebay\.com\/itm\//,"//www.ebay.co.uk/itm/"):"#"};
const fee=x=>{const r=S.rules;if(r.seller==="private")return 0;return x*r.feePct/100+(x>10?r.feeFixed:Math.min(r.feeFixed,0.30))};
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

/* sold-price parser: prefers £ amounts, ignores dates, reports unreadable lines */
function parse(t){
  const rows=[],bad=[];
  String(t||"").split(/\n|;/).forEach(raw=>{
    let l=raw.trim();if(!l)return;
    let d=null,m;
    if(m=l.match(/\d{4}-\d{2}-\d{2}/))d=new Date(m[0]);
    else if(m=l.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){const y=m[3].length===2?"20"+m[3]:m[3];d=new Date(y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"))}
    else if(m=l.match(/(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*(\d{4})?/i)){d=new Date(+(m[3]||new Date().getFullYear()),MON[m[2].toLowerCase()],+m[1])}
    l=l.replace(/\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{2,4}/g," ").replace(/\b\d{1,2}\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(\s*\d{4})?/gi," ").replace(/(\d)\.\s+(\d)/g,"$1.$2");
    let p=null,pm=l.match(/£\s*(\d[\d,]*(?:\.\d{1,2})?)/);
    if(pm)p=parseFloat(pm[1].replace(/,/g,""));
    else{const all=(l.replace(/,(?=\d{3}\b)/g,"").match(/\d+(?:\.\d+)?/g)||[]).map(Number);const dec=all.find(x=>!Number.isInteger(x));p=dec!=null?dec:(all.length===1?all[0]:null)}
    if(p!=null&&p>0&&p<100000)rows.push({p,d:d&&!isNaN(d)?d:null});else bad.push(raw.trim());
  });
  return{rows,bad};
}

function money(){
  const r=S.rules,I=S.items;
  const hold=I.filter(i=>HOLD.includes(i.status)),done=I.filter(i=>DONE.includes(i.status)),watch=I.filter(i=>PRE.includes(i.status));
  const committed=hold.reduce((t,i)=>t+(+i.buy||0)+(+i.pack||0),0);
  const realised=done.reduce((t,i)=>t+(+i.profit||0),0);
  const spent=done.reduce((t,i)=>t+(+i.buy||0)+(+i.pack||0),0);
  const days=done.filter(i=>i.boughtOn&&i.soldOn).map(i=>(new Date(i.soldOn)-new Date(i.boughtOn))/864e5);
  const errs=done.filter(i=>i.expProfit!=null&&i.profit!=null).map(i=>i.profit-i.expProfit);
  const stale=hold.filter(i=>i.boughtOn&&(Date.now()-new Date(i.boughtOn))/864e5>r.staleDays).length;
  return{committed,realised,hold,done,watch,stale,watchTotal:watch.reduce((t,i)=>t+(+i.buy||0),0),
    cash:r.budget+realised-committed,
    avgDays:days.length?days.reduce((a,b)=>a+b,0)/days.length:null,
    roi:spent>0?realised/spent*100:null,
    err:errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:null,nErr:errs.length};
}

/* most you can pay and still pass every rule */
function maxPay(med,cons,post,pack,withMoney){
  const r=S.rules,N=med-fee(med)-post-pack,k=r.minRoi/100;
  let m=Math.min(N-r.minProfit,(N-k*pack)/(1+k),r.cheap===false?Infinity:cons-fee(cons)-post-pack-0.01);
  if(r.maxPrice>0)m=Math.min(m,r.maxPrice);
  if(withMoney){const mo=money();m=Math.min(m,mo.cash,r.maxStock-mo.committed-pack)}
  return Math.floor(m*100)/100;
}

function evaluate(f){
  const r=S.rules,{rows,bad}=parse(f.sp),prices=rows.map(x=>x.p);
  if(!prices.length)return{bad,empty:true};
  const hasBuy=String(f.b).trim()!=="",buy=num(f.b),post=num(f.p),pack=num(f.k),active=num(f.a);
  const med=median(prices),avg=prices.reduce((a,b)=>a+b,0)/prices.length,cons=pct(prices,.25);
  const outl=prices.filter(x=>x>med*1.5||x<med*.5).length;
  const prof=x=>x-buy-fee(x)-post-pack;
  const p=prof(med),pc=prof(cons),inv=buy+pack,roi=inv>0?p/inv*100:0;
  let conf="Low";if(prices.length>=10&&outl<=prices.length*.2)conf="High";else if(prices.length>=r.minSales&&outl<=prices.length*.3)conf="Medium";
  const dated=rows.filter(x=>x.d);let freq="";
  if(dated.length>=2){const ts=dated.map(x=>+x.d),span=Math.max(1,(Math.max(...ts)-Math.min(...ts))/864e5);freq=`About ${(dated.length/span*30).toFixed(1)} sales per 30 days (from ${dated.length} dated sales)`}
  const st=active>0?prices.length/(prices.length+active)*100:null;
  const m=money(),mp=maxPay(med,cons,post,pack,true);
  const data=[[prices.length>=r.minSales,`${prices.length} sold prices (you want at least ${r.minSales})`],[conf!=="Low",conf==="Low"?"Sold prices vary a lot or there are too few":"Sold prices are consistent enough to trust"]];
  const buyC=hasBuy?[
    [p>=r.minProfit,`Profit ${gbp(p)} (you want at least ${gbp(r.minProfit)})`],
    [!(r.minRoi>0)||roi>=r.minRoi,r.minRoi>0?`Return ${roi.toFixed(0)}% on your money (you want at least ${r.minRoi}%)`:`Return ${roi.toFixed(0)}% on your money`],
    [pc>0,`Still profitable if it sells at the low end (${gbp(pc)})`],
    ...(r.maxPrice>0?[[buy<=r.maxPrice,`Price ${gbp(buy)} is under your overall limit of ${gbp(r.maxPrice)}`]]:[]),
    [m.cash>=buy,`You have ${gbp(m.cash)} available to spend`],
    [m.committed+inv<=r.maxStock,`Money in unsold stock stays under ${gbp(r.maxStock)} (would be ${gbp(m.committed+inv)})`]]:[];
  const checks=[...buyC,...data];
  const score=hasBuy?Math.round(Math.max(0,Math.min(40,p/Math.max(1,r.minProfit)*20))+Math.max(0,Math.min(20,roi/Math.max(1,r.minRoi)*10))+(conf==="High"?20:conf==="Medium"?10:0)+(st==null?0:Math.min(20,st/3))):null;
  return{hasBuy,buy,post,pack,med,avg,cons,count:prices.length,outl,p,pc,roi,conf,checks,pass:checks.every(c=>c[0]),fee:fee(med),min:Math.min(...prices),max:Math.max(...prices),freq,st,score,maxBuy:mp,bad};
}

/* ---------- toasts, sheets, tips ---------- */
let tT=null;
function toast(msg,label,fn){
  $("tmsg").textContent=msg;const b=$("tbtn");b.style.display=label?"":"none";b.textContent=label||"";b.onclick=()=>{$("toast").style.display="none";fn&&fn()};
  $("toast").style.display="flex";clearTimeout(tT);tT=setTimeout(()=>$("toast").style.display="none",label?6000:2600);
}
function openSheet(h){$("sheet").innerHTML='<div class="grab"></div>'+h;$("ov").style.display="block";requestAnimationFrame(()=>{if(sheetOn)$("sheet").classList.add("on")});sheetOn=true}
function closeSheet(){$("sheet").classList.remove("on");$("ov").style.display="none";sheetOn=false;if(window._dvKeep!==undefined){DV=window._dvKeep;window._dvKeep=undefined}}
const TIPS={
 maxpay:["Max you can pay","The highest price (including delivery to you) where this item still meets all your rules: minimum profit, minimum return, staying profitable at the low end, and your budget."],
 roi:["Return (ROI)","Profit divided by what you spent. 30% means you make £30 for every £100 you put in."],
 median:["Typical sold price","The middle sold price: half sold for more, half for less. One odd sale can't drag it around like an average can."],
 low:["Low-end price","The price that 1 in 4 sales went below. If it still makes a profit there, the deal has a safety margin."],
 conf:["Confidence","How much to trust the price data. High needs 10+ sold prices with few odd ones out."],
 st:["Sell-through","Sold listings compared to sold plus active ones. Higher means it sells faster."],
 fees:["eBay fees","Private sellers in the UK pay no final value fee on most items. Business sellers pay a percentage plus a per-order fee. Set yours in Settings."],
 search:["Search words","What Scan types into eBay. Every word must appear in a listing's title for it to show."],
 bpf:["Buyer protection fee","When you buy from a private seller on eBay UK, eBay adds a small fee for you: about £0.10 + 7% of the first £20, 4% up to £300. FlipScout adds an estimate so profit isn't overstated. Business sellers' items have no fee, so it's left off those. You can turn this off in Settings."],
 skip:["Skip words","Listings with any of these words in the title are ignored, e.g. case, box only, faulty."]};
function tip(k){const t=TIPS[k];openSheet(`<h2 style="margin-top:0">${t[0]}</h2><p style="font-size:16px">${t[1]}</p><button onclick="closeSheet()">Got it</button>`)}
const ti=k=>`<button class="tip" aria-label="What is this?" onclick="event.stopPropagation();tip('${k}')">?</button>`;

/* ---------- navigation ---------- */
const TABS=[["deals","Deals","bolt"],["follow","Following","bell"],["stock","My Stock","stock"],["settings","Settings","menu"],];

(function(){let tx=0,ty=0,moved=false;const sel=e=>e.target&&e.target.closest&&e.target.closest("select:not([disabled]):not([multiple])");

// Capacitor sends every press of the phone's Back button twice: to the App plugin listener and as the page's "backbutton"
// event. On the emulator the plugin listener can stop being called while the page event still arrives (diagnosis 14 Nov),
// so both are listened to. They are PAIRED, not timed: a source acts only if it isn't behind the other, so each physical
// press runs onBack() exactly once whichever arrives first, if only one arrives, and even for quick repeated presses.
const HWB={p:0,d:0,n:0};
function hwBack(src){const me=src==="p"?"p":"d",other=me==="p"?"d":"p",act=HWB[me]>=HWB[other];HWB[me]++;if(!act)return;HWB.n++;
  if(!onBack()){const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(A)A.exitApp()}}
try{const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(A){A.addListener("backButton",()=>hwBack("p"));document.addEventListener("backbutton",()=>hwBack("d"))}}catch(e){}

  document.querySelector('meta[name=theme-color]').content=dark?"#131529":"#F6F6FA";
}

    ANCH[render.last]=c&&window.scrollY>0?{id:c.dataset.id,top:c.getBoundingClientRect().top}:null}

  // settings now lives in the bottom bar (Menu); the top button is only a Back button on pages opened from somewhere else
  const back=["deal","cats","admin","plist"].includes(tab),menuOn=["settings","cats","admin","plist"].includes(tab);
  $("gear").style.visibility=back?"visible":"hidden";$("gear").innerHTML=I.back;$("gear").onclick=()=>{onBack()};
  $("gear").setAttribute("aria-label","Back");
  $("nav").innerHTML=TABS.map(t=>`<button class="${tab===t[0]||(t[0]==="settings"&&menuOn)?"on":""}" onclick="go('${t[0]}')" aria-label="${t[1]}"><span class="pill">${I[t[2]]}</span>${t[1]}</button>`).join("");

    const back=()=>{const c=a&&[...document.querySelectorAll(".dcard[data-id]")].find(c=>c.dataset.id===a.id);if(c)window.scrollBy(0,c.getBoundingClientRect().top-a.top);else if(y)window.scrollTo(0,y)};
    if(y||a){back();requestAnimationFrame(()=>{back();requestAnimationFrame(back)})}render.last=tab}

const CKEY="flipscout_cats_v1";let CT=null,CTload=null;

function loadCats(force){
  if(CT&&!force)return Promise.resolve(CT);
  if(!force){try{const x=JSON.parse(localStorage.getItem(CKEY)||"null");if(x&&x.rows&&Date.now()-x.at<30*864e5){CT=buildCT(x.rows);return Promise.resolve(CT)}}catch(e){}}
  const s=S.set;if(!s.url||!s.key)return Promise.reject(new Error("noconn"));
  if(CTload)return CTload;
  CTload=kfetch(s.url,s.key,"tree=1").then(async r=>{
    if(r.status===401)throw new Error("wrong key");if(!r.ok)throw new Error("error "+r.status);
    const d=await r.json();if(d.error)throw new Error(d.error);
    const rows=[];(function walk(node,parent){(node.childCategoryTreeNodes||[]).forEach(ch=>{rows.push([ch.category.categoryId,ch.category.categoryName,parent]);walk(ch,ch.category.categoryId)})})(d.rootCategoryNode,"0");
    if(!rows.length)throw new Error("empty category list");
    try{localStorage.setItem(CKEY,JSON.stringify({at:Date.now(),rows}))}catch(e){}
    CT=buildCT(rows);return CT}).finally(()=>{CTload=null});
  return CTload;
}
function catChain(id){const out=[];let x=id;while(x&&x!=="0"&&CT[x]){out.unshift(x);x=CT[x].p}return out}

    return`<select aria-label="${i?"Subcategory":"Category"}" style="margin-top:${i?8:0}px" onchange="catPick('${key}',${i},this.value)"><option value="">${i?`All of ${esc(CT[par].n)}`:"Any category"}</option>${kids.map(k=>`<option value="${k}"${k===sel?" selected":""}>${esc(CT[k].n)}${CT[k].c.length?" ›":""}</option>`).join("")}</select>`}).join("");

function catPick(key,level,val){

function retApply(it,kind,v,day){const n=x=>+x||0,r2=x=>Math.round(x*100)/100;
  if(!DONE.includes(it.status)||!isSold(it))return"Only a sold item can have a return or refund.";

  if(refund<0||back<0||n(v.retPost)<0)return"Amounts can't be negative.";
  if(kind!=="back"&&!(refund>0))return"Add how much you refunded.";
  if(refund>left+0.005)return`That's more than the ${gbp(left)} the buyer still has from this sale.`;
  const rec={on:day,kind,refund:r2(refund),feesBack:r2(back),retPost:r2(n(v.retPost)),soldPrice:n(it.soldPrice),fees:n(it.fees),outPost:n(it.outPost)};

const unq=v=>String(v??"").trim().replace(/^'(?=[=+\-@])/,"");
const itemKey=i=>[String(i.name||"").trim().toLowerCase(),i.boughtOn||"",Math.round((+i.buy||0)*100)].join("|");

/* the whole import, worked out without changing anything: {add:[records], dups:[{line,why}], errors:[{line,msg}], unknown, map} */
function csvImportPlan(text,kind,existing,idBase){
  const out={add:[],dups:[],errors:[],unknown:[],map:{},fatal:""};text=String(text||"");
  if(text.length>CSV_MAX){out.fatal="That file is too big (over 2 MB). Split it into smaller files.";return out}
  if(!text.trim()){out.fatal="That file is empty.";return out}
  const res=Papa.parse(text.replace(/^﻿/,""),{header:true,skipEmptyLines:"greedy",transformHeader:h=>String(h).trim()});
  const fields=(res.meta&&res.meta.fields)||[];if(!fields.length){out.fatal="No column names found on the first line.";return out}
  if(res.data.length>CSV_ROWS){out.fatal=`That file has ${res.data.length} rows; the most at once is ${CSV_ROWS}.`;return out}
  const {map,unknown}=csvHeaderMap(fields,kind);out.map=map;out.unknown=unknown;
  const need=kind==="items"?"name":"amount";
  if(!map[need]){out.fatal=kind==="items"?"No “Name” column found. The first line needs column names like Name, Paid, Status.":"No “Amount” column found. The first line needs column names like Date, Description, Amount.";return out}
  const bad=new Set();for(const e of res.errors||[]){if(e.row==null||e.code==="UndetectableDelimiter")continue;const r=Math.max(0,Math.min(e.row,res.data.length-1));
    if(!bad.has(r)){bad.add(r);out.errors.push({line:r+2,msg:"The row isn't laid out properly (check quotes and commas)."})}}
  const ids=new Set((existing||[]).map(x=>String(x.id))),keys=new Set((existing||[]).map(kind==="items"?itemKey:expKey));let k=0;
  res.data.forEach((row,ri)=>{if(bad.has(ri))return;const line=ri+2,g=f=>map[f]!=null?row[map[f]]:undefined,err=m=>out.errors.push({line,msg:m});
    if(kind==="items"){
      const name=unq(g("name")).slice(0,200);if(!name)return err("No name.");
      const stRaw=unq(g("status"));const status=stRaw?STOCK.find(s=>s.toLowerCase()===stRaw.toLowerCase()):"Bought";
      if(!status)return err(`Status “${stRaw.slice(0,30)}” isn't one of: ${STOCK.join(", ")}.`);
      const it={name,status};
      for(const f of["buy","pack","other","outPost","exp","soldPrice","fees","refund","feesBack","sunk","recovered"]){const v=csvNum(g(f));if(Number.isNaN(v))return err(`“${map[f]}” isn't a number: ${String(g(f)).slice(0,20)}`);if(v!=null)it[f]=v}
      for(const f of["boughtOn","soldOn"]){const v=csvDate(g(f));if(v===null)return err(`“${map[f]}” isn't a date (use 2026-11-13 or 13/11/2026).`);it[f]=v}
      if(DONE.includes(status)&&status!=="Written off"&&it.soldPrice==null)return err(`It's ${status} but has no sale total.`);
      if(!DONE.includes(status)&&it.soldPrice!=null)return err(`It has a sale total but its status is ${status}.`);
      if((it.refund||0)>(it.soldPrice||0)+0.005)return err("Refunded is more than the sale total.");
      const url=unq(g("url"));if(url)it.url=/^https:\/\/([a-z0-9-]+\.)*ebay\.[a-z.]+\//i.test(url)?url.slice(0,500):"";
      const id=String(unq(g("id")));if(id&&ids.has(id)){out.dups.push({line,why:"already in My Stock (same ID)"});return}
      const key=itemKey(it);if(keys.has(key)){out.dups.push({line,why:"already in My Stock (same name, date and price)"});return}keys.add(key);
      for(const f of["buy","pack","outPost"])if(it[f]==null)it[f]=0;
      it.id=idBase+k++;it.cond="";it.url=it.url||"";it.imported=today();if(DONE.includes(status))it.profit=itemProfit(it);
      it.expProfit=it.exp?itemEst(it):null;out.add.push(it)}
    else{
      const amount=csvNum(g("amount"));if(amount==null)return err("No amount.");if(Number.isNaN(amount))return err(`“${map.amount}” isn't a number: ${String(g("amount")).slice(0,20)}`);
      if(!(amount>0))return err("The amount must be more than £0.");
      const date=csvDate(g("date"));if(date===null)return err(`“${map.date}” isn't a date (use 2026-11-13 or 13/11/2026).`);if(!date)return err("No date.");
      const catRaw=unq(g("cat")),cat=EXCAT.find(c=>c.toLowerCase()===catRaw.toLowerCase())||"Other";
      const e={date,desc:unq(g("desc")).slice(0,200)||(catRaw&&cat==="Other"?catRaw.slice(0,200):""),cat,amount:Math.round(amount*100)/100};
      const id=String(unq(g("id")));if(id&&ids.has(id)){out.dups.push({line,why:"already in your expenses (same ID)"});return}
      const key=expKey(e);if(keys.has(key)){out.dups.push({line,why:"already in your expenses (same date, amount and description)"});return}keys.add(key);
      e.id=idBase+k++;out.add.push(e)}});
  return out}

function calcResult(c){const r=S.rules,rows=parse(c.sp||"").rows.map(x=>x.p),fromList=rows.length>0;

  if(!(sell>0))return null;
  const post=num(c.post),pack=num(c.pack),ship=num(c.ship),useBpf=!!c.bpf,hasBuy=String(c.buy).trim()!=="",buy=num(c.buy);
  const f=fee(sell),mp=maxPay(sell,low,post,pack,false),mpOk=mp>0;
  const out={sell,low,fromList,n:rows.length,post,pack,fee:f,maxTotal:mpOk?mp:null,

  if(hasBuy){out.buy=buy;out.profit=sell-f-post-pack-buy;out.lowProfit=low-fee(low)-post-pack-buy;out.roi=buy+pack>0?out.profit/(buy+pack)*100:null}

/* ---------- SCAN ---------- */
function prodMax(b){return maxPay(b.med,b.cons,b.post,b.pack,false)}
function untrack(id){const ix=S.base.findIndex(b=>b.id===id);if(ix<0)return;const [b]=S.base.splice(ix,1);save();render();toast("Stopped tracking.","Undo",()=>{S.base.splice(ix,0,b);save();render()})}
async function runScan(list,label){
  const s=S.set,r=S.rules;list=Array.isArray(list)?list:S.base;
  if(!s.url||!s.key){go("settings");toast("Add the Scan connection under Advanced.");return}
  if(!list.length){toast("Track an item first: Check it, then tap Track for Scan.");return}
  SC={res:[],busy:true,msg:"",prog:"",label:label||""};render();
  const out=[],errs=[];let n=0;
  for(const b of list){
    n++;SC.prog=`Scanning ${n} of ${list.length}: ${b.name}`;const pe=$("prog");if(pe)pe.textContent=SC.prog;
    try{
      const lim=prodMax(b);if(lim<=0){errs.push(b.name+": no price passes your rules");continue}
      const res=await kfetch(s.url,s.key,`q=${encodeURIComponent(b.q)}&max=${Math.ceil(lim)}&region=${s.region||"uk"}${b.cat?"&cat="+b.cat:""}`);
      if(res.status===401)throw new Error("wrong key (check Settings)");
      if(!res.ok)throw new Error("service error "+res.status);
      const d=await res.json();if(d.error)throw new Error(d.error);
      const ex=(b.x||"").toLowerCase().split(/[,]+/).map(w=>w.trim()).filter(Boolean);
      const need=b.q.toLowerCase().split(/\s+/).filter(Boolean),nz=w=>w.replace(/[^a-z0-9]/g,"");
      for(const l of d.items||[]){
        const t=(l.title||"").toLowerCase(),tz=nz(t);
        if(!need.every(w=>t.includes(w)||tz.includes(nz(w))))continue;
        if(ex.some(w=>t.includes(w)))continue;
        if(/parts|not working/i.test(l.cond||"")&&!/faulty|incomplete/i.test(b.cond||""))continue;
        const buy=(+l.price||0)+(+l.ship||0);if(buy>lim||buy<b.med*r.minPct/100)continue;
        const p=b.med-fee(b.med)-b.post-b.pack-buy,pc=b.cons-fee(b.cons)-b.post-b.pack-buy,roi=(buy+b.pack)>0?p/(buy+b.pack)*100:0;
        out.push({...l,buy,p,pc,roi,b,lim});
      }
    }catch(e){errs.push(b.name+": "+(e.message==="Failed to fetch"?"no connection":e.message))}
  }
  out.sort((a,b)=>b.p-a.p);
  SC={res:out,busy:false,msg:errs.join(" · "),at:new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),prog:"",label:label||"",list:label?list:null};render();
}
function addScan(i){
  const l=SC.res[i],b=l.b,r=S.rules;
  S.items.unshift({id:Date.now(),url:l.url||"",f:{...BLANK,n:l.title,b:String(l.buy.toFixed(2)),p:String(b.post),k:String(b.pack),c:b.cond||"Used",sp:b.sp||"",q:b.q,x:b.x||"",cat:b.cat||"",catName:b.catName||""},name:l.title,cond:l.cond||b.cond||"",status:"Considered",buy:l.buy,pack:b.pack,outPost:b.post,exp:b.med,expProfit:l.p,conf:b.conf,maxBuy:l.lim,score:Math.round(Math.min(40,l.p/Math.max(1,r.minProfit)*20)+Math.min(20,l.roi/Math.max(1,r.minRoi)*10)+(b.conf==="High"?20:b.conf==="Medium"?10:0)),boughtOn:""});
  save();toast("Saved to Deals.","View",()=>go("deals"));
}

     return`<div class="card"><b>${esc(l.title)}</b>

  return`<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--card2)">
   ${cell(auc?"Current bid":"Buy it now",gbp(f.price||0),postNote(f))}
   ${cell(auc?"Your max bid":"Your max",gbp(f.max),auc?"":"incl. postage","ok")}
   ${cell("Profit",prof==null?"—":(prof>=0?"+":"−")+gbp(Math.abs(prof)),prof==null?"price not known":auc?"after fees, if you win at max":"after fees, at this price",prof==null?"":prof>0?"ok":"bad")}</div>`}
function vFollow(){
  if(connected()&&FL.list===null&&!FL.busy&&!FL.err)setTimeout(loadFollows,0);
  const L=FL.list||[];
  const state=f=>{const total=(f.price||0)+(f.ship||0),ended=f.status!=="live",now=f.type==="AUC"?(f.price||0):total,under=now<=f.max;
    return{ended,now,under,txt:ended?(f.type==="AUC"&&now>f.max?"Went over your max":"Ended"):under?"Under your max":f.type==="AUC"?"Above your max":"Waiting for a drop",cls:ended?"bad":under?"ok":"warn"}};
  const live=L.filter(f=>f.status==="live"),done=L.filter(f=>f.status!=="live");
  const fcard=f=>{const s=state(f),gap=s.now-f.max;
    return`<div class="card"${s.ended?' style="opacity:.7"':""}>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="chip ${s.cls}">${s.txt}</span><span class="mu" style="font-size:13px">${f.type==="AUC"?"Auction"+(f.end&&!s.ended?" · "+left(f.end):""):"Buy It Now"}</span></div>
    <div style="display:flex;gap:12px;margin-top:10px">${f.img?`<img src="${esc(f.img)}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:12px;flex:none;background:var(--card2)" loading="lazy">`:""}
     <div style="min-width:0"><div style="font-weight:700;line-height:1.3">${esc(f.title)}</div><div class="mu">${esc(f.cond||"")}${f.med?(f.cond?" · ":"")+"worth about "+gbp(f.med):""}</div></div></div>
    ${followRow(f,s)}
    ${s.ended?"":`<div class="mu" style="margin-top:4px;font-size:13px">${gap>0?`${gbp(gap)} above your max`:`${gbp(-gap)} under your max`}${f.type==="AUC"?" · put "+gbp(f.max)+" as your max bid and eBay bids for you":""}</div>`}
    <div style="display:flex;gap:8px;margin-top:10px">${s.ended?"":`<a href="${esc(ukUrl(f.url))}" target="_blank" rel="noopener" style="flex:1.3;display:flex"><button style="margin:0;flex:1;padding:12px 8px;white-space:nowrap">${f.type==="AUC"?"Bid on eBay":"Open on eBay"}</button></a><button class="s" style="margin:0;flex:1;padding:12px 8px;white-space:nowrap" onclick="changeMax('${esc(String(f.id).replace(/\D/g,""))}')">Change max</button>`}<button class="s" style="margin:0;flex:1;padding:12px 8px" onclick="unfollow('${esc(String(f.id).replace(/\D/g,""))}')">Remove</button></div></div>`};
  return`<h2>Following</h2>
  ${connected()?`<div class="hint" style="margin:-6px 4px 12px">${H().alerts&&PUSH.registered?"You'll get an alert when one hits your price or is about to end.":"<span style='display:flex;align-items:center;justify-content:space-between;gap:10px'><span class='warn'>Phone alerts are off.</span><button class='sm' onclick=\"go('settings')\">Turn on alerts</button></span>"}</div>`:""}
  ${!connected()?`<div class="card empty">${I.bell}<b>Connect your Scan service</b><div class="mu">Following needs your Scan service. It watches listings for you and alerts you.</div><button onclick="goConnect()">Connect now</button></div>`:""}
  ${FL.err?`<div class="card bad">${esc(FL.err)}</div>`:""}
  ${FL.list===null&&connected()?`<div class="card mu">Loading…</div>`:""}
  ${live.map(fcard).join("")}
  ${!L.length&&FL.list!==null?`<div class="card empty">${I.bell}<b>Not following anything yet</b><div class="mu">Open a deal and tap <b>Follow</b>, then set the most you'd pay. FlipScout watches it and alerts you.</div><button onclick="go('deals')">See today's deals</button></div>`:""}
  ${done.length?`<h3 style="margin:18px 4px 6px">Ended</h3>`+done.map(fcard).join(""):""}`;
}
/* My categories */
function vCats(){
  const h=H(),lr={};(HD.learned||[]).forEach(x=>lr[x.cat]=x.n);
  if(!connected())return`<h2>My categories</h2><div class="card">Connect your Scan service first.</div><button onclick="goConnect()">Connect now</button>`;
  setTimeout(()=>{CAT.h=CAT.h||"";drawCat("h")},0);
  const cb=(k,label)=>`<label class="chkrow" style="min-height:44px;margin:4px 0"><input type="checkbox" ${h.types[k]?"checked":""} onchange="H().types.${k}=this.checked;save();pushConfig()"><span>${label}</span></label>`;
  return`<h2>My categories</h2><div class="mu" style="margin:-6px 4px 12px">FlipScout hunts in these for you, around the clock.</div>${starterLeft()&&h.cats.length<15?`<div class="card"><b>Popular for flipping</b><div class="mu">${STARTER.map(x=>x[1]).join(", ")}. FlipScout knows these model by model, so it finds real deals fastest.</div><button onclick="addStarter()">Add popular categories</button></div>`:""}
  ${h.cats.map((c,i)=>`<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><b>${esc(c.name)}</b><div class="mu">${esc(c.path||"")}</div><div class="hint ${lr[c.id]?"ok":"warn"}" style="margin-top:4px">${lr[c.id]?lr[c.id]+" sales learned":"Learning prices… (first deals usually within a day or two)"}</div></div><button class="d" style="margin:0;min-height:40px;padding:8px 12px" onclick="rmCat(${i})" aria-label="Remove ${esc(c.name)}">Remove</button></div>`).join("")||`<div class="card mu">No categories yet. Add one below.</div>`}
  <div class="card" style="border-style:dashed"><b>Add a category</b><div id="catbox_h" style="margin-top:10px"></div>
   <button style="width:100%" onclick="addCat()" ${h.cats.length>=15?"disabled":""}>Add this category</button><div class="hint">Choose step by step, e.g. Computers › Components › Graphics Cards. The narrower, the better the prices. Up to 15. Up to 8 are checked every scan; more than that take turns.</div></div>
  <div class="card"><b>What to hunt for</b>
   ${cb("bin","Buy It Now listings below their value")}
   ${cb("auction","Auctions ending soon you can win cheaply")}
   ${cb("misspelt","Misspelt titles (fewer people find them)")}
   ${cb("spares","Spares or repairs (shows what the seller says, you judge it)")}
   <label for="hm">Minimum score</label><select id="hm" onchange="H().minScore=+this.value;save();pushConfig()">${[[30,"Any (30+)"],[50,"Medium (50+)"],[70,"High only (70+)"]].map(o=>`<option value="${o[0]}"${h.minScore===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select>
   <div class="hint">Minimum profit and return come from Settings › Your buying rules (now ${gbp(S.rules.minProfit)}${S.rules.minRoi>0?` and ${S.rules.minRoi}%`:""}).</div>
</div>`;
}
// Popular flip categories FlipScout already knows how to match model-by-model (UK category numbers)
const STARTER=[["27386","Graphics Cards"],["139971","Video Game Consoles"],["9355","Mobile & Smart Phones"],["171485","Tablets & eBook Readers"],["177","PC Laptops & Netbooks"],["164","CPUs/Processors"],["80053","Monitors"],["170083","Memory (RAM)"],["175669","Solid State Drives"]];
async function addStarter(){const h=H();try{await loadCats()}catch(e){}
  let n=0;STARTER.forEach(([id,nm])=>{if(h.cats.length>=15||h.cats.some(c=>c.id===id))return;if(CT&&!CT[id])return;
    h.cats.push({id,name:CT&&CT[id]?CT[id].n:nm,path:CT&&CT[id]?catPathOf(id):""});n++});
  save();pushConfig(true);render();toast(n?`Added ${n} popular categor${n>1?"ies":"y"}. FlipScout starts hunting now.`:"You already have these.")}
const starterLeft=()=>STARTER.filter(([id])=>!H().cats.some(c=>c.id===id)).length;
function addCat(){const id=CAT.h;if(!id||!CT||!CT[id]){toast("Pick a category first.");return}const h=H();
  if(h.cats.some(c=>c.id===id)){toast("Already in your list.");return}
  h.cats.push({id,name:CT[id].n,path:catPathOf(id)});CAT.h="";save();pushConfig(true);render();toast(`Hunting in ${CT[id].n}.`)}
function rmCat(i){const h=H(),[c]=h.cats.splice(i,1);save();pushConfig();render();toast("Removed.","Undo",()=>{h.cats.splice(i,0,c);save();pushConfig();render()})}
/* alerts */
/* FlipScout's own push notifications (Firebase via the Capacitor plugin) */
const PN=()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.PushNotifications;
const PUSH={native:!!PN(),registered:false,err:"",token:""};
let pushReady=false;
function pushListeners(){const P=PN();if(!P||pushReady)return;pushReady=true;
  try{P.createChannel({id:"deals",name:"Deals and price alerts",description:"New deals and followed listings",importance:5,visibility:1,vibration:true})}catch(e){}
  P.addListener("registration",async t=>{PUSH.token=t.value;PUSH.err="";
    try{const r=await api("device=1",{token:t.value,name:"Android"});PUSH.registered=true;if(!r.ready)PUSH.err="Your service still needs its alert key. Finish the Firebase setup steps."}catch(e){PUSH.err="Couldn't register this phone: "+errText(e)}
    if(tab==="settings"||tab==="follow")render()});
  P.addListener("registrationError",e=>{PUSH.err="This phone couldn't register for alerts ("+((e&&e.error)||"unknown")+").";if(tab==="settings")render()});
  P.addListener("pushNotificationReceived",n=>{toast((n.title||"FlipScout")+": "+(n.body||""),"View",()=>openPushed(n.data||{}))});
  P.addListener("pushNotificationActionPerformed",a=>openPushed((a.notification&&a.notification.data)||{}));
}
function openPushed(d){if(d.kind==="follow"){FL.list=null;go("follow");return}
  (async()=>{for(let i=0;i<60&&HD.busy;i++)await new Promise(r=>setTimeout(r,250));HD.deals=null;go("deals");await loadDeals();
    for(let i=0;i<60&&HD.busy;i++)await new Promise(r=>setTimeout(r,250));const i=(HD.deals||[]).findIndex(x=>String(x.id)===String(d.id));if(i>=0)openDeal(i);else toast("That deal has gone (sold, ended or no longer cheap).")})()}
async function enableAlerts(){const P=PN();if(!P){toast("Alerts work in the installed app.");return}
  pushListeners();PUSH.err="";
  try{let st=await P.checkPermissions();if(st.receive!=="granted")st=await P.requestPermissions();
    if(st.receive!=="granted"){PUSH.err="Notifications are blocked. Allow them for FlipScout in your phone's Settings › Apps › FlipScout › Notifications.";render();return}
    H().alerts=true;save();pushConfig();await P.register();toast("Setting up alerts…")}
  catch(e){PUSH.err="Couldn't turn on alerts: "+(e.message||e);render()}}
async function autoPush(){const P=PN();if(!P||!connected()||!H().alerts)return;pushListeners();
  try{const st=await P.checkPermissions();if(st.receive==="granted")await P.register()}catch(e){}}
async function testAlert(){try{await api("test=1");toast("Test alert sent. It should pop up in a few seconds.")}catch(e){toast("Couldn't send: "+errText(e))}}

/* ---------- WELCOME ---------- */
const OB=[
 ["logo","Your 24/7 bargain hunter","Pick the eBay categories you know. FlipScout checks them every few minutes and finds listings priced below what they sell for."],
 ["bolt","Estimates, with the evidence","Every deal shows an estimated profit after fees and postage, and the sales it's based on. Profits are estimates, not promises: always read the listing and check the sold prices before you buy. Risky-looking listings are flagged or hidden, but not every problem can be spotted."],
 ["bell","Follow and get alerts","Set the most you'd pay. Your phone pings when a deal appears or a followed listing drops to your price."],
 ["seller","How do you sell on eBay?","This sets your fees so the profit figures are right. You can change it later in Settings."]];
function showOnb(){$("onb").style.display="flex";renderOnb()}
function renderOnb(){
  const s=OB[ob],last=ob===OB.length-1;
  $("onb").innerHTML=`<div style="text-align:right">${last?"":`<button class="link" onclick="finishOnb()">Skip</button>`}</div>
  <div class="art">${s[0]==="logo"?`<div class="wm" style="font-size:40px;margin-bottom:8px" aria-label="Fliptimize"><b>flip</b>timize</div>`:s[0]==="seller"?"":I[s[0]]}<h1>${s[1]}</h1><p>${s[2]}</p>
  ${last?`<div style="width:100%;margin-top:14px"><button class="choice ${S.rules.seller==="private"?"on":""}" onclick="S.rules.seller='private';save();pushConfig();renderOnb()">Private seller<small>Selling my own things now and then</small></button><button class="choice ${S.rules.seller!=="private"?"on":""}" onclick="S.rules.seller='business';save();pushConfig();renderOnb()">Business seller<small>Buying to resell regularly</small></button></div>`:""}</div>
  <div class="dots">${OB.map((_,i)=>`<i class="${i===ob?"on":""}"></i>`).join("")}</div>
  ${last?`<button style="width:100%;margin:0" onclick="finishOnb()">Start using FlipScout</button>`
  :`<button style="width:100%;margin:0" onclick="ob++;renderOnb()">Next</button>`}`;
}
function finishOnb(){try{localStorage.setItem(OKEY,"1")}catch(e){}$("onb").style.display="none";tab="deals";prev=[];render()}

H();render();
autoPush();
try{if(!localStorage.getItem(OKEY))showOnb()}catch(e){}
// offer to restore a cloud backup once, on a fresh install, never on every open
(()=>{let asked=false;try{asked=!!localStorage.getItem("flipscout_restore_asked")}catch(e){}
  if(!asked&&connected()&&!S.items.length&&!S.base.length){try{localStorage.setItem("flipscout_restore_asked","1")}catch(e){}cloudCheck(true)}})();
setTimeout(()=>{try{if(window._rulesNew&&connected()){save();pushConfig()}}catch(e){}},2500);
