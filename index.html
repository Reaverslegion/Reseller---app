<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D172C">
<title>FlipScout</title>
<style>
:root{--bg:#f3f6fb;--card:#ffffff;--card2:#eef2f8;--tx:#0f1b33;--mu:#52607a;--bd:#d9e1ee;--ac:#15803d;--acbg:#dcfce7;--ok:#15803d;--okbg:#dcfce7;--bad:#c62828;--badbg:#fde2e2;--warn:#a15c00;--warnbg:#fff1d6;--grad:linear-gradient(135deg,#10d98a,#a3e635);--ontx:#0b1a14;--shadow:0 1px 3px rgba(15,27,51,.08),0 4px 14px rgba(15,27,51,.06);--nav:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D172C;--card:#15223f;--card2:#1b2a4b;--tx:#eef2fb;--mu:#a3b2cf;--bd:#26395f;--ac:#4ade80;--acbg:#123a2a;--ok:#4ade80;--okbg:#123a2a;--bad:#f87171;--badbg:#3d1d27;--warn:#fbbf24;--warnbg:#3a2f14;--shadow:0 2px 12px rgba(0,0,0,.3);--nav:#111d37}}
:root[data-theme=dark]{--bg:#0D172C;--card:#15223f;--card2:#1b2a4b;--tx:#eef2fb;--mu:#a3b2cf;--bd:#26395f;--ac:#4ade80;--acbg:#123a2a;--ok:#4ade80;--okbg:#123a2a;--bad:#f87171;--badbg:#3d1d27;--warn:#fbbf24;--warnbg:#3a2f14;--shadow:0 2px 12px rgba(0,0,0,.3);--nav:#111d37}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;max-width:680px;margin:auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:24px;letter-spacing:-.6px;flex:1}
.brand img{height:36px;width:auto}.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;margin:0;padding:0}
.iconbtn svg{width:24px;height:24px}
main{padding:4px 14px 14px;max-width:680px;margin:auto}
h2{font-size:20px;margin:6px 4px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:4px}
.num{width:28px;height:28px;border-radius:50%;background:var(--acbg);color:var(--ac);display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 5px;font-weight:600}
input,textarea,select{width:100%;min-height:48px;padding:11px 12px;font:inherit;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:15px}
.hint{font-size:14px;color:var(--mu);margin-top:6px}
button{min-height:48px;padding:12px 18px;font:inherit;font-weight:700;border:0;border-radius:14px;background:var(--grad);color:var(--ontx);margin:10px 8px 0 0;cursor:pointer}
button.s{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
button.d{background:var(--badbg);color:var(--bad)}
button.link{background:none;color:var(--ac);padding:8px 4px;min-height:40px;margin:4px 0 0}
button:disabled{opacity:.55}
.btns{display:flex;flex-wrap:wrap}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.mu{color:var(--mu);font-size:14px}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}.stat{font-size:20px;font-weight:800}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.verdict{border-radius:16px;padding:16px;margin-bottom:12px}
.verdict.good{background:var(--okbg);border:1.5px solid var(--ok)}
.verdict.no{background:var(--badbg);border:1.5px solid var(--bad)}
.verdict.info{background:var(--card);border:1.5px solid var(--ac)}
.verdict h3{margin:0 0 4px;font-size:22px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--mu);border:1px solid var(--bd)}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.li{display:flex;gap:8px;margin:7px 0;font-size:15px}
.tip{display:inline-grid;place-items:center;width:22px;height:22px;min-height:0;padding:0;margin:0 0 0 4px;border-radius:50%;background:var(--card2);color:var(--mu);border:1px solid var(--bd);font-size:13px;font-weight:800;vertical-align:middle}
details summary{cursor:pointer;color:var(--ac);font-weight:700;padding:10px 0;min-height:44px;list-style:none}
details summary::-webkit-details-marker{display:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nav);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;margin:0;border-radius:0;background:none;color:var(--mu);padding:8px 0 10px;min-height:64px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ac)}
nav button.on .pill{background:var(--acbg)}
.pill{padding:3px 18px;border-radius:99px;display:grid;place-items:center}
.empty{text-align:center;padding:28px 18px}
.empty svg{width:48px;height:48px;color:var(--ac);margin-bottom:6px}
.empty b{display:block;font-size:18px;margin-bottom:6px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:560px;margin:auto;background:#0f1b33;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:10px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast span{flex:1}#toast button{margin:0;min-height:40px;padding:8px 14px;background:none;color:#4ade80}
#ov{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;z-index:21;max-width:680px;margin:auto}
#sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--bd);margin:0 auto 12px}
#onb{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding:24px 22px calc(22px + env(safe-area-inset-bottom))}
#onb .art{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:460px;margin:auto}
#onb .art svg,#onb .art img{width:96px;height:96px;margin-bottom:20px;color:var(--ac)}
#onb h1{font-size:26px;margin:0 0 10px;letter-spacing:-.5px}
#onb p{color:var(--mu);font-size:17px;margin:0}
.dots{display:flex;gap:7px;justify-content:center;margin:18px 0}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--bd)}.dots i.on{background:var(--ac);width:22px}
.choice{display:block;width:100%;text-align:left;margin:10px 0 0;background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}
.choice.on{border-color:var(--ac);background:var(--acbg)}
.choice small{display:block;font-weight:500;color:var(--mu);font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;border:1px solid var(--bd)}
.seg button{flex:1;margin:0;background:none;color:var(--mu);min-height:42px;padding:8px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--shadow)}
a{color:inherit;text-decoration:none}
</style>
</head>

/* sold-price parser: prefers £ amounts, ignores dates, reports unreadable lines */

  const rows=[],bad=[];
  String(t||"").split(/\n|;/).forEach(raw=>{
    let l=raw.trim();if(!l)return;
    let d=null,m;
    if(m=l.match(/\d{4}-\d{2}-\d{2}/))d=new Date(m[0]);
    else if(m=l.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){const y=m[3].length===2?"20"+m[3]:m[3];d=new Date(y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"))}
    else if(m=l.match(/(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*(\d{4})?/i)){d=new Date(+(m[3]||new Date().getFullYear()),MON[m[2].toLowerCase()],+m[1])}
    l=l.replace(/\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{2,4}/g," ").replace(/\b\d{1,2}\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(\s*\d{4})?/gi," ").replace(/(\d)\.\s+(\d)/g,"$1.$2");
    let p=null,pm=l.match(/£\s*(\d[\d,]*(?:\.\d{1,2})?)/);
    if(pm)p=parseFloat(pm[1].replace(/,/g,""));
    else{const all=(l.replace(/,(?=\d{3}\b)/g,"").match(/\d+(?:\.\d+)?/g)||[]).map(Number);const dec=all.find(x=>!Number.isInteger(x));p=dec!=null?dec:(all.length===1?all[0]:null)}
    if(p!=null&&p>0&&p<100000)rows.push({p,d:d&&!isNaN(d)?d:null});else bad.push(raw.trim());
  });
  return{rows,bad};
}

function money(){
  const r=S.rules,I=S.items;
  const hold=I.filter(i=>HOLD.includes(i.status)),done=I.filter(i=>DONE.includes(i.status)),watch=I.filter(i=>PRE.includes(i.status));
  const committed=hold.reduce((t,i)=>t+(+i.buy||0)+(+i.pack||0),0);
  const realised=done.reduce((t,i)=>t+(+i.profit||0),0);
  const spent=done.reduce((t,i)=>t+(+i.buy||0)+(+i.pack||0),0);
  const days=done.filter(i=>i.boughtOn&&i.soldOn).map(i=>(new Date(i.soldOn)-new Date(i.boughtOn))/864e5);
  const errs=done.filter(i=>i.expProfit!=null&&i.profit!=null).map(i=>i.profit-i.expProfit);
  const stale=hold.filter(i=>i.boughtOn&&(Date.now()-new Date(i.boughtOn))/864e5>r.staleDays).length;
  return{committed,realised,hold,done,watch,stale,watchTotal:watch.reduce((t,i)=>t+(+i.buy||0),0),
    cash:r.budget+realised-committed,
    avgDays:days.length?days.reduce((a,b)=>a+b,0)/days.length:null,
    roi:spent>0?realised/spent*100:null,
    err:errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:null,nErr:errs.length};
}

/* most you can pay and still pass every rule */
function maxPay(med,cons,post,pack,withMoney){
  const r=S.rules,N=med-fee(med)-post-pack,k=r.minRoi/100;
  let m=Math.min(N-r.minProfit,(N-k*pack)/(1+k),cons-fee(cons)-post-pack-0.01);
  if(r.maxPrice>0)m=Math.min(m,r.maxPrice);
  if(withMoney){const mo=money();m=Math.min(m,mo.cash,r.maxStock-mo.committed-pack)}
  return Math.floor(m*100)/100;
}

function evaluate(f){
  const r=S.rules,{rows,bad}=parse(f.sp),prices=rows.map(x=>x.p);
  if(!prices.length)return{bad,empty:true};
  const hasBuy=String(f.b).trim()!=="",buy=num(f.b),post=num(f.p),pack=num(f.k),active=num(f.a);
  const med=median(prices),avg=prices.reduce((a,b)=>a+b,0)/prices.length,cons=pct(prices,.25);
  const outl=prices.filter(x=>x>med*1.5||x<med*.5).length;
  const prof=x=>x-buy-fee(x)-post-pack;
  const p=prof(med),pc=prof(cons),inv=buy+pack,roi=inv>0?p/inv*100:0;
  let conf="Low";if(prices.length>=10&&outl<=prices.length*.2)conf="High";else if(prices.length>=r.minSales&&outl<=prices.length*.3)conf="Medium";
  const dated=rows.filter(x=>x.d);let freq="";
  if(dated.length>=2){const ts=dated.map(x=>+x.d),span=Math.max(1,(Math.max(...ts)-Math.min(...ts))/864e5);freq=`About ${(dated.length/span*30).toFixed(1)} sales per 30 days (from ${dated.length} dated sales)`}
  const st=active>0?prices.length/(prices.length+active)*100:null;
  const m=money(),mp=maxPay(med,cons,post,pack,true);
  const data=[[prices.length>=r.minSales,`${prices.length} sold prices (you want at least ${r.minSales})`],[conf!=="Low",conf==="Low"?"Sold prices vary a lot or there are too few":"Sold prices are consistent enough to trust"]];
  const buyC=hasBuy?[
    [p>=r.minProfit,`Profit ${gbp(p)} (you want at least ${gbp(r.minProfit)})`],
    [roi>=r.minRoi,`Return ${roi.toFixed(0)}% on your money (you want at least ${r.minRoi}%)`],
    [pc>0,`Still profitable if it sells at the low end (${gbp(pc)})`],
    ...(r.maxPrice>0?[[buy<=r.maxPrice,`Price ${gbp(buy)} is under your overall limit of ${gbp(r.maxPrice)}`]]:[]),
    [m.cash>=buy,`You have ${gbp(m.cash)} available to spend`],
    [m.committed+inv<=r.maxStock,`Money in unsold stock stays under ${gbp(r.maxStock)} (would be ${gbp(m.committed+inv)})`]]:[];
  const checks=[...buyC,...data];
  const score=hasBuy?Math.round(Math.max(0,Math.min(40,p/Math.max(1,r.minProfit)*20))+Math.max(0,Math.min(20,roi/Math.max(1,r.minRoi)*10))+(conf==="High"?20:conf==="Medium"?10:0)+(st==null?0:Math.min(20,st/3))):null;
  return{hasBuy,buy,post,pack,med,avg,cons,count:prices.length,outl,p,pc,roi,conf,checks,pass:checks.every(c=>c[0]),fee:fee(med),min:Math.min(...prices),max:Math.max(...prices),freq,st,score,maxBuy:mp,bad};
}

    <div class="mu" style="margin-top:4px">Cost ${gbp((+i.buy||0)+(+i.pack||0))}${i.boughtOn?" · bought "+i.boughtOn:""}${old?` · <span class="warn">slow seller</span>`:""}</div>
    ${DONE.includes(i.status)?`<div class="${i.profit>=0?"ok":"bad"}" style="font-weight:700;margin-top:4px">Profit ${gbp(i.profit)} <span class="mu">(sold ${gbp(i.soldPrice)}, fees ${gbp(i.fees)}, expected ${gbp(i.expProfit||0)})</span></div>`:`<div class="mu">Expected profit ${gbp(i.expProfit||0)}</div>`}
    <div class="btns">${nx?`<button onclick="setStage(${i.id},'${nx[0]}')">${nx[1]}</button>`:""}
     <select aria-label="Change stage" style="width:auto;margin:10px 8px 0 0;flex:1;min-width:130px" onchange="setStage(${i.id},this.value)"><option value="">Change stage…</option>${STOCK.filter(s=>s!==i.status).map(s=>`<option>${s}</option>`).join("")}</select>
     <button class="s" onclick="edit(${i.id})">Edit</button><button class="d" onclick="del(${i.id})">Delete</button></div></div>`}).join("");
}
function setStage(id,st){
  if(!st)return;const it=S.items.find(i=>i.id===id);if(!it)return;
  if(st==="Sold"&&!DONE.includes(it.status)){soldSheet(id);return}
  const before={...it};
  if(!DONE.includes(st)){delete it.profit}
  if(DONE.includes(st)&&it.profit==null&&it.soldPrice!=null)it.profit=it.soldPrice-(it.fees||0)-(it.outPost||0)-it.buy-it.pack;
  if(DONE.includes(st)&&it.soldPrice==null){soldSheet(id,st);return}
  it.status=st;save();render();toast(`Moved to ${st}.`,"Undo",()=>{Object.assign(it,before);if(before.profit==null)delete it.profit;save();render()});
}
function soldSheet(id,target="Sold"){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  openSheet(`<h2 style="margin-top:0">Mark as sold</h2><div class="mu">${esc(it.name)}</div>
  <label for="sd_p">Sale price £ (what the buyer paid for the item)</label><input id="sd_p" inputmode="decimal" value="${it.exp?it.exp.toFixed(2):""}" oninput="$('sd_f').value=fee(num(this.value)).toFixed(2);sdCalc(${id})">
  <label for="sd_f">eBay fees £ ${ti("fees")}</label><input id="sd_f" inputmode="decimal" value="${fee(it.exp||0).toFixed(2)}" oninput="sdCalc(${id})">
  <label for="sd_o">Postage you paid £</label><input id="sd_o" inputmode="decimal" value="${it.outPost||0}" oninput="sdCalc(${id})">
  <div id="sd_r" class="stat" style="margin-top:12px"></div>
  <div class="btns"><button onclick="sdSave(${id},'${target}')">Save sale</button><button class="s" onclick="closeSheet()">Cancel</button></div>`);
  sdCalc(id);
}
function sdCalc(id){const it=S.items.find(i=>i.id===id),p=num($("sd_p").value)-num($("sd_f").value)-num($("sd_o").value)-it.buy-it.pack;$("sd_r").innerHTML=`Profit <span class="${p>=0?"ok":"bad"}">${gbp(p)}</span>`}
function sdSave(id,target){
  const it=S.items.find(i=>i.id===id),before={...it};
  Object.assign(it,{soldPrice:num($("sd_p").value),fees:num($("sd_f").value),outPost:num($("sd_o").value),soldOn:today(),status:target});
  it.profit=it.soldPrice-it.fees-it.outPost-it.buy-it.pack;save();closeSheet();render();
  toast(`Sold for ${gbp(it.profit)} profit.`,"Undo",()=>{for(const k of Object.keys(it))delete it[k];Object.assign(it,before);save();render()});
}
function del(id){
  const ix=S.items.findIndex(i=>i.id===id);if(ix<0)return;const [it]=S.items.splice(ix,1);save();render();
  toast("Deleted.","Undo",()=>{S.items.splice(ix,0,it);save();render()});
}

/* ---------- MONEY ---------- */
function vDash(){
  const m=money(),r=S.rules;
  if(!S.items.length)return`<h2>Money</h2><div class="card empty">${I.chart}<b>Nothing to count yet</b><div class="mu">Once you buy and sell items, your cash, profit and how fast things sell show here. Your budget is ${gbp(r.budget)} (change it in Settings).</div><button onclick="go('calc')">Check an item</button></div>`;
  return`<h2>Money</h2><div class="card"><div class="mu">Cash available to spend</div><div class="big ${m.cash<0?"bad":"ok"}">${gbp(m.cash)}</div>
   <div class="mu">Your budget ${gbp(r.budget)} + profit made ${gbp(m.realised)} − money in unsold stock ${gbp(m.committed)}</div></div>
   <div class="card"><div class="grid">
   <div><div class="mu">In unsold stock</div><div class="stat">${gbp(m.committed)}</div></div>
   <div><div class="mu">Profit made</div><div class="stat ${m.realised>=0?"ok":"bad"}">${gbp(m.realised)}</div></div>
   <div><div class="mu">Items sold</div><div class="stat">${m.done.length}</div></div>
   <div><div class="mu">Return on sold items</div><div class="stat">${m.roi==null?"–":m.roi.toFixed(0)+"%"}</div></div>
   <div><div class="mu">Average days to sell</div><div class="stat">${m.avgDays==null?"–":m.avgDays.toFixed(1)}</div></div>
   <div><div class="mu">Slow sellers (${r.staleDays}+ days)</div><div class="stat ${m.stale?"warn":""}">${m.stale}</div></div>
   <div><div class="mu">Deals on watchlist</div><div class="stat">${m.watch.length}</div></div>
   <div><div class="mu">Watchlist total</div><div class="stat">${gbp(m.watchTotal)}</div></div></div></div>
   <div class="card"><b>How accurate are my estimates?</b>
   <div class="mu" style="margin-top:6px">${m.err==null?"Sell a few items first. FlipScout then compares real profit with what it predicted.":`Across ${m.nErr} sale(s), real profit was ${gbp(Math.abs(m.err))} ${m.err>=0?"more":"less"} than predicted on average.${m.nErr<20?" That's still too few sales to call it a pattern.":""}`}</div></div>`;
}

/* ---------- SETTINGS ---------- */
const FIELDS=[["minProfit","Minimum profit per item £","Skip anything that makes less than this."],["minRoi","Minimum return %","Profit as a % of what you spend. 30 means £30 back for every £100."],["budget","Total buying budget £","The money you're willing to have in reselling."],["maxStock","Max money in unsold stock £","Stops you tying up too much cash in stock."],["maxPrice","Overall max price per item £","Never pay more than this for one item. 0 means no limit."],["minSales","Minimum sold prices needed","Fewer than this and the price data isn't trusted."],["staleDays","Days before stock counts as slow",""],["minPct","Scan: ignore listings under this % of the typical price","Filters out cases, cables and parts. 35 is a good start."]];
function vSettings(){
  const r=S.rules,s=S.set;
  return`<h2>Settings</h2>
  <div class="card"><b>How do you sell on eBay?</b>${ti("fees")}
   <button class="choice ${r.seller==="private"?"on":""}" onclick="setSeller('private')">Private seller<small>No final value fee on most items (UK)</small></button>
   <button class="choice ${r.seller!=="private"?"on":""}" onclick="setSeller('business')">Business seller<small>${r.feePct}% + ${gbp(r.feeFixed)} per order</small></button>
   ${r.seller!=="private"?`<div class="row"><div><label for="r_feePct">Fee %</label><input id="r_feePct" inputmode="decimal" value="${r.feePct}" onchange="setRule('feePct',this.value)"></div><div><label for="r_feeFixed">Per-order fee £</label><input id="r_feeFixed" inputmode="decimal" value="${r.feeFixed}" onchange="setRule('feeFixed',this.value)"></div></div><div class="hint">Rates vary by category. Check eBay's fee page for yours.</div>`:`<div class="hint">If you buy to resell regularly, eBay and HMRC may treat you as a business.</div>`}</div>
  <div class="card"><b>Appearance</b><div class="seg" style="margin-top:10px">${[["auto","Auto"],["light","Light"],["dark","Dark"]].map(t=>`<button class="${(s.theme||"auto")===t[0]?"on":""}" onclick="S.set.theme='${t[0]}';save();render()">${t[1]}</button>`).join("")}</div><div class="hint">Auto follows your phone's setting.</div></div>
  <div class="card"><b>Your buying rules</b><div class="mu">These decide what counts as a good buy. Changes save straight away.</div>
   ${FIELDS.map(f=>`<label for="r_${f[0]}">${f[1]}</label><input id="r_${f[0]}" inputmode="decimal" value="${r[f[0]]}" onchange="setRule('${f[0]}',this.value)">${f[2]?`<div class="hint">${f[2]}</div>`:""}`).join("")}</div>
  <div class="card"><b>Backup</b><div class="mu">Your data lives only on this phone. Save a backup now and then.</div>
   <div class="btns"><button onclick="backup()">Save backup</button><button class="s" onclick="restoreSheet()">Restore</button></div></div>
  <details class="card"><summary>Advanced: Scan connection</summary>
   <div class="mu">The address and key of your Scan service.</div>
   <label for="s_url">Service address</label><input id="s_url" value="${esc(s.url)}" placeholder="https://something.workers.dev" onchange="S.set.url=this.value.trim();save();toast('Saved.')">
   <label for="s_key">Key</label><input id="s_key" value="${esc(s.key)}" onchange="S.set.key=this.value.trim();save();toast('Saved.')">
   <label for="s_reg">Where sellers are</label><select id="s_reg" onchange="S.set.region=this.value;save();toast('Saved.')"><option value="uk"${s.region!=="any"?" selected":""}>UK sellers only</option><option value="any"${s.region==="any"?" selected":""}>Anywhere that posts to the UK</option></select>
   <div class="hint">Overseas sellers may add import fees and slower delivery.</div></details>
  <div class="card"><button class="s" onclick="ob=0;showOnb()">Show the welcome guide again</button><div class="mu" style="margin-top:10px">FlipScout ${VER}</div></div>`;
}
function setSeller(v){S.rules.seller=v;save();render();toast(v==="private"?"Private seller: no final value fee.":"Business seller fees on.")}
function setRule(k,v){if(String(v).trim()===""){toast("Left unchanged.");render();return}const n=num(v);if(n<0){toast("Can't be negative.");render();return}S.rules[k]=n;save();toast("Saved.")}
async function backup(){
  const t=JSON.stringify(S);
  try{if(navigator.share){await navigator.share({title:"FlipScout backup "+today(),text:t});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(t);toast("Backup copied. Paste it into a private note.")}catch(e){openSheet(`<h2 style="margin-top:0">Your backup</h2><div class="mu">Long-press, Select all, Copy, then paste into a private note.</div><textarea readonly style="min-height:200px">${esc(t)}</textarea><button onclick="closeSheet()">Done</button>`)}
}
function restoreSheet(){openSheet(`<h2 style="margin-top:0">Restore a backup</h2><div class="mu">Paste your backup text. This replaces everything in the app.</div><textarea id="imp" style="min-height:160px"></textarea><div class="btns"><button onclick="restore()">Restore</button><button class="s" onclick="closeSheet()">Cancel</button></div>`)}
function restore(){
  try{const x=JSON.parse($("imp").value);if(!x.rules||!Array.isArray(x.items))throw 0;
   const keep=JSON.stringify(S);localStorage.setItem(KEY,$("imp").value);S=load();save();closeSheet();tab="dash";render();
   toast("Backup restored.","Undo",()=>{localStorage.setItem(KEY,keep);S=load();render()})}
  catch(e){toast("That doesn't look like a FlipScout backup.")}
}

/* ---------- SCAN ---------- */
function prodMax(b){return maxPay(b.med,b.cons,b.post,b.pack,false)}
function untrack(id){const ix=S.base.findIndex(b=>b.id===id);if(ix<0)return;const [b]=S.base.splice(ix,1);save();render();toast("Stopped tracking.","Undo",()=>{S.base.splice(ix,0,b);save();render()})}
async function runScan(){
  const s=S.set,r=S.rules;
  if(!s.url||!s.key){go("settings");toast("Add the Scan connection under Advanced.");return}
  if(!S.base.length){toast("Track an item first: Check it, then tap Track for Scan.");return}
  SC={res:[],busy:true,msg:"",prog:""};render();
  const out=[],errs=[];let n=0;
  for(const b of S.base){
    n++;SC.prog=`Scanning ${n} of ${S.base.length}: ${b.name}`;const pe=$("prog");if(pe)pe.textContent=SC.prog;
    try{
      const lim=prodMax(b);if(lim<=0){errs.push(b.name+": no price passes your rules");continue}
      const res=await fetch(`${s.url}?key=${encodeURIComponent(s.key)}&q=${encodeURIComponent(b.q)}&max=${Math.ceil(lim)}&region=${s.region||"uk"}`);
      if(res.status===401)throw new Error("wrong key (check Settings)");
      if(!res.ok)throw new Error("service error "+res.status);
      const d=await res.json();if(d.error)throw new Error(d.error);
      const ex=(b.x||"").toLowerCase().split(/[,]+/).map(w=>w.trim()).filter(Boolean);
      const need=b.q.toLowerCase().split(/\s+/).filter(Boolean),nz=w=>w.replace(/[^a-z0-9]/g,"");
      for(const l of d.items||[]){
        const t=(l.title||"").toLowerCase(),tz=nz(t);
        if(!need.every(w=>t.includes(w)||tz.includes(nz(w))))continue;
        if(ex.some(w=>t.includes(w)))continue;
        if(/parts|not working/i.test(l.cond||"")&&!/faulty|incomplete/i.test(b.cond||""))continue;
        const buy=(+l.price||0)+(+l.ship||0);if(buy>lim||buy<b.med*r.minPct/100)continue;
        const p=b.med-fee(b.med)-b.post-b.pack-buy,pc=b.cons-fee(b.cons)-b.post-b.pack-buy,roi=(buy+b.pack)>0?p/(buy+b.pack)*100:0;
        out.push({...l,buy,p,pc,roi,b,lim});
      }
    }catch(e){errs.push(b.name+": "+(e.message==="Failed to fetch"?"no connection":e.message))}
  }
  out.sort((a,b)=>b.p-a.p);
  SC={res:out,busy:false,msg:errs.join(" · "),at:new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),prog:""};render();
}
function addScan(i){
  const l=SC.res[i],b=l.b,r=S.rules;
  S.items.unshift({id:Date.now(),url:l.url||"",f:{...BLANK,n:l.title,b:String(l.buy.toFixed(2)),p:String(b.post),k:String(b.pack),c:b.cond||"Used",sp:b.sp||"",q:b.q,x:b.x||""},name:l.title,cond:l.cond||b.cond||"",status:"Considered",buy:l.buy,pack:b.pack,outPost:b.post,exp:b.med,expProfit:l.p,conf:b.conf,maxBuy:l.lim,score:Math.round(Math.min(40,l.p/Math.max(1,r.minProfit)*20)+Math.min(20,l.roi/Math.max(1,r.minRoi)*10)+(b.conf==="High"?20:b.conf==="Medium"?10:0)),boughtOn:""});
  save();toast("Saved to Deals.","View",()=>go("deals"));
}
function vScan(){
  const ready=S.set.url&&S.set.key;
  let h=`<h2>Scan eBay</h2><div class="card"><div class="mu">Looks for live listings of your tracked items that are cheap enough to meet your rules${S.set.region==="any"?"":" (UK sellers only)"}.</div>
   ${ready?`<button onclick="runScan()" ${SC.busy||!S.base.length?"disabled":""}>${SC.busy?"Scanning…":"Scan now"}</button><div id="prog" class="mu" style="margin-top:8px">${esc(SC.prog||"")}</div>`
   :`<div class="hint warn" style="margin-top:8px">Scan isn't connected yet.</div><button class="s" onclick="go('settings')">Open Settings</button>`}</div>`;
  if(SC.msg)h+=`<div class="card bad" style="font-size:15px">${esc(SC.msg)}</div>`;
  if(SC.res&&!SC.busy){
    h+=SC.res.length?`<div class="mu" style="margin:0 4px 10px">${SC.res.length} match${SC.res.length>1?"es":""} at ${SC.at}. Always read the listing before buying.</div>`:`<div class="card mu">No listings cheap enough right now (checked ${SC.at}). Try again later. Bargains come and go.</div>`;
    h+=SC.res.map((l,i)=>{const hr=l.end?new Date(l.end).getHours():null;
     return`<div class="card"><b>${esc(l.title)}</b>
     <div style="margin:6px 0"><span class="chip">${l.auction?"Auction":"Buy It Now"}</span> <span class="chip">${esc(l.cond||"")}</span>${l.loc&&l.loc!=="GB"?` <span class="chip warn">Ships from ${esc(l.loc)}</span>`:""}${hr!==null&&hr<6?` <span class="chip warn">Ends overnight</span>`:""}</div>
     <div class="stat ok">${gbp(l.p)} profit</div>
     <div class="mu">${l.auction?`Current bid ${gbp(l.buy)} incl. ${gbp(l.ship||0)} postage. <b>Bid up to ${gbp(Math.max(0,l.lim-(+l.ship||0)))}</b>.`:`Costs ${gbp(l.buy)} incl. ${gbp(l.ship||0)} postage.`} Return ${l.roi.toFixed(0)}%.</div>
     <div class="mu">Compared with ${l.b.count} sold prices saved ${l.b.on} (${l.b.conf} confidence)</div>
     <div class="btns"><a href="${esc(ukUrl(l.url))}" target="_blank" rel="noopener"><button>Open on eBay</button></a><button class="s" onclick="addScan(${i})">Save to Deals</button></div></div>`}).join("");
  }
  h+=`<div class="card"><b>Tracked items</b>`+(S.base.length?S.base.map(b=>`<div style="padding:10px 0;border-top:1px solid var(--bd);margin-top:8px"><div><b>${esc(b.name)}</b></div><div class="mu">Pays up to <span class="ok" style="font-weight:700">${gbp(prodMax(b))}</span> · typical sold ${gbp(b.med)} · prices from ${b.on}</div><button class="d" style="min-height:40px;padding:8px 14px" onclick="untrack(${b.id})">Stop tracking</button></div>`).join(""):`<div class="mu" style="margin-top:6px">Nothing tracked yet. Check an item, then tap <b>Track for Scan</b>.</div><button class="s" onclick="go('calc')">Check an item</button>`)+`</div>`;
  return h;
}

/* ---------- WELCOME ---------- */
const OB=[
 ["logo","Know before you buy","Paste what an item has sold for on eBay. FlipScout tells you your real profit after fees, and the most you should pay."],
 ["scan","Find bargains for you","Track items you know, and Scan searches eBay for listings cheap enough to make you money."],
 ["stock","Track every flip","Follow each item from bought to sold, and see your cash, profit and what's selling slowly."],
 ["seller","How do you sell on eBay?","This sets your fees so the profit figures are right. You can change it later in Settings."]];
function showOnb(){$("onb").style.display="flex";renderOnb()}
function renderOnb(){
  const s=OB[ob],last=ob===OB.length-1,logo=document.querySelector(".brand img").src;
  $("onb").innerHTML=`<div style="text-align:right">${last?"":`<button class="link" onclick="finishOnb()">Skip</button>`}</div>
  <div class="art">${s[0]==="logo"?`<img src="${logo}" alt="">`:s[0]==="seller"?"":I[s[0]]}<h1>${s[1]}</h1><p>${s[2]}</p>
  ${last?`<div style="width:100%;margin-top:14px"><button class="choice ${S.rules.seller==="private"?"on":""}" onclick="S.rules.seller='private';save();renderOnb()">Private seller<small>Selling my own things now and then</small></button><button class="choice ${S.rules.seller!=="private"?"on":""}" onclick="S.rules.seller='business';save();renderOnb()">Business seller<small>Buying to resell regularly</small></button></div>`:""}</div>
  <div class="dots">${OB.map((_,i)=>`<i class="${i===ob?"on":""}"></i>`).join("")}</div>
  ${last?`<button style="width:100%;margin:0 0 8px" onclick="finishOnb(true)">Try an example</button><button class="s" style="width:100%;margin:0" onclick="finishOnb()">Start using FlipScout</button>`
  :`<button style="width:100%;margin:0" onclick="ob++;renderOnb()">Next</button>`}`;
}
function finishOnb(ex){try{localStorage.setItem(OKEY,"1")}catch(e){}$("onb").style.display="none";if(ex){F={...EXAMPLE};saveDraft();ED=null}tab="calc";prev=[];render()}

render();
try{if(!localStorage.getItem(OKEY))showOnb()}catch(e){}
</script>
