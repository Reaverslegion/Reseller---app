<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D172C">
<meta name="color-scheme" content="light dark">
<title>FlipScout</title>
<script>try{var t=(JSON.parse(localStorage.getItem("resell_helper_v1")||"{}").set||{}).theme;if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#e6ecf4;--card:#ffffff;--card2:#e2e9f3;--tx:#08122a;--mu:#3a475f;--bd:#c3cfe1;--ac:#11703a;--acbg:#cdf5db;--ok:#11703a;--okbg:#cdf5db;--bad:#b42318;--badbg:#fcdcdc;--warn:#8a4b00;--warnbg:#ffecc7;--grad:linear-gradient(135deg,#10d98a,#a3e635);--ontx:#0b1a14;--shadow:0 1px 2px rgba(8,18,42,.10),0 6px 18px rgba(8,18,42,.09);--nav:#0D172C;--navmu:#a3b2cf;--navac:#4ade80;--navacbg:#123a2a;--navbd:#0D172C}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D172C;--card:#15223f;--card2:#1b2a4b;--tx:#eef2fb;--mu:#a3b2cf;--bd:#26395f;--ac:#4ade80;--acbg:#123a2a;--ok:#4ade80;--okbg:#123a2a;--bad:#f87171;--badbg:#3d1d27;--warn:#fbbf24;--warnbg:#3a2f14;--shadow:0 2px 12px rgba(0,0,0,.3);--nav:#111d37;--navmu:var(--mu);--navac:var(--ac);--navacbg:var(--acbg);--navbd:var(--bd)}}
:root[data-theme=dark]{--bg:#0D172C;--card:#15223f;--card2:#1b2a4b;--tx:#eef2fb;--mu:#a3b2cf;--bd:#26395f;--ac:#4ade80;--acbg:#123a2a;--ok:#4ade80;--okbg:#123a2a;--bad:#f87171;--badbg:#3d1d27;--warn:#fbbf24;--warnbg:#3a2f14;--shadow:0 2px 12px rgba(0,0,0,.3);--nav:#111d37;--navmu:var(--mu);--navac:var(--ac);--navacbg:var(--acbg);--navbd:var(--bd)}
:root{color-scheme:light dark}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
/* Design tokens shared by both themes (colours above are the semantic colour tokens) */
:root{--r-sm:10px;--r-md:14px;--r-lg:18px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--fs-label:12px;--fs-meta:13px;--fs-body:16px;--fs-num:19px;--fs-h:20px;--ease:150ms ease;--focus:0 0 0 3px var(--ac)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.stat,.big,.li>span:last-child,.num-t{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:6px}
button,.card[role=button]{transition:transform var(--ease),opacity var(--ease)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;max-width:680px;margin:auto}
/* light mode: navy brand bar behind the logo (the logo's colours are made for navy) */
.brandbar{background:var(--brandbar,transparent)}
:root{--brandbar:#0D172C;--brandtx:#ffffff}
:root[data-theme=dark]{--brandbar:transparent;--brandtx:var(--tx)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--brandbar:transparent;--brandtx:var(--tx)}}
.brandbar .brand{color:var(--brandtx)}
.brandbar .iconbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--brandtx)}
:root[data-theme=dark] .brandbar .iconbtn{background:var(--card);border-color:var(--bd)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .brandbar .iconbtn{background:var(--card);border-color:var(--bd)}}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:24px;letter-spacing:-.6px;flex:1}
.brand img{height:36px;width:auto}.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;margin:0;padding:0}
.iconbtn svg{width:24px;height:24px}
main{padding:4px 14px 14px;max-width:680px;margin:auto}
h2{font-size:20px;margin:6px 4px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:4px}
.num{width:28px;height:28px;border-radius:50%;background:var(--acbg);color:var(--ac);display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 5px;font-weight:600}
input,textarea,select{width:100%;min-height:48px;padding:11px 12px;font:inherit;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;flex:none;accent-color:var(--ac);margin:0}
.chkrow{display:flex;gap:12px;align-items:center;font-size:15px;cursor:pointer}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:15px}
.hint{font-size:14px;color:var(--mu);margin-top:6px}
button{min-height:48px;padding:12px 18px;font:inherit;font-weight:700;border:0;border-radius:14px;background:var(--grad);color:var(--ontx);margin:10px 8px 0 0;cursor:pointer}
button.s{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
button.d{background:var(--badbg);color:var(--bad)}
button.link{background:none;color:var(--ac);padding:8px 4px;min-height:40px;margin:4px 0 0}
button:disabled{opacity:.55}
.btns{display:flex;flex-wrap:wrap}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.mu{color:var(--mu);font-size:14px}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}.stat{font-size:20px;font-weight:800}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.verdict{border-radius:16px;padding:16px;margin-bottom:12px}
.verdict.good{background:var(--okbg);border:1.5px solid var(--ok)}
.verdict.no{background:var(--badbg);border:1.5px solid var(--bad)}
.verdict.info{background:var(--card);border:1.5px solid var(--ac)}
.verdict h3{margin:0 0 4px;font-size:22px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--mu);border:1px solid var(--bd)}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.li{display:flex;gap:8px;margin:7px 0;font-size:15px}
.tip{display:inline-grid;place-items:center;width:22px;height:22px;min-height:0;padding:0;margin:0 0 0 4px;border-radius:50%;background:var(--card2);color:var(--mu);border:1px solid var(--bd);font-size:13px;font-weight:800;vertical-align:middle}
details summary{cursor:pointer;color:var(--ac);font-weight:700;padding:10px 0;min-height:44px;list-style:none}
details summary::-webkit-details-marker{display:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nav);border-top:1px solid var(--navbd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;margin:0;border-radius:0;background:none;color:var(--navmu);padding:8px 0 10px;min-height:64px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--navac)}
nav button.on .pill{background:var(--navacbg)}
.pill{padding:3px 18px;border-radius:99px;display:grid;place-items:center}
.empty{text-align:center;padding:28px 18px}
.empty svg{width:48px;height:48px;color:var(--ac);margin-bottom:6px}
.empty b{display:block;font-size:18px;margin-bottom:6px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:560px;margin:auto;background:#0f1b33;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:10px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast span{flex:1}#toast button{margin:0;min-height:40px;padding:8px 14px;background:none;color:#4ade80}
#ov{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;z-index:21;max-width:680px;margin:auto}
#sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--bd);margin:0 auto 12px}
#onb{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding:24px 22px calc(22px + env(safe-area-inset-bottom))}
#onb .art{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:460px;margin:auto}
#onb .art svg,#onb .art img{width:96px;height:96px;margin-bottom:20px;color:var(--ac)}
#onb h1{font-size:26px;margin:0 0 10px;letter-spacing:-.5px}
#onb p{color:var(--mu);font-size:17px;margin:0}
.dots{display:flex;gap:7px;justify-content:center;margin:18px 0}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--bd)}.dots i.on{background:var(--ac);width:22px}
.choice{display:block;width:100%;text-align:left;margin:10px 0 0;background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}
.choice.on{border-color:var(--ac);background:var(--acbg)}
.choice small{display:block;font-weight:500;color:var(--mu);font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;border:1px solid var(--bd)}
.seg button{flex:1;margin:0;background:none;color:var(--mu);min-height:42px;padding:8px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--shadow)}
a{color:inherit;text-decoration:none}

.fac{padding:14px 0 2px;border-top:1px solid var(--bd);margin-top:12px}
.fac-h{display:flex;justify-content:space-between;align-items:baseline}
.fac-n{font-weight:700;font-size:16px}.fac-p{font-weight:800;font-size:17px}.fac-p small{font-weight:600;font-size:12px;color:var(--mu);margin-left:1px}
.fac-w{color:var(--mu);font-size:14px;margin-top:2px}
.meter{height:6px;border-radius:99px;background:var(--bd);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#10d98a,#a3e635)}
.fac-d{font-size:14px;margin-top:8px}
</style>
</head>

const gbp=n=>(n<0?"-£":"£")+Math.abs(+n||0).toFixed(2);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/[£,\s]/g,""));return isNaN(n)?0:n};
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const pct=(a,p)=>{const s=[...a].sort((x,y)=>x-y),i=(s.length-1)*p,l=Math.floor(i),h=Math.ceil(i);return s[l]+(s[h]-s[l])*(i-l)};
const ukUrl=u=>String(u||"").replace(/\/\/(www\.)?ebay\.com\/itm\//,"//www.ebay.co.uk/itm/");
const fee=x=>{const r=S.rules;if(r.seller==="private")return 0;return x*r.feePct/100+(x>10?r.feeFixed:Math.min(r.feeFixed,0.30))};
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

/* sold-price parser: prefers £ amounts, ignores dates, reports unreadable lines */
function parse(t){
  const rows=[],bad=[];
  String(t||"").split(/\n|;/).forEach(raw=>{
    let l=raw.trim();if(!l)return;
    let d=null,m;
    if(m=l.match(/\d{4}-\d{2}-\d{2}/))d=new Date(m[0]);
    else if(m=l.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){const y=m[3].length===2?"20"+m[3]:m[3];d=new Date(y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"))}
    else if(m=l.match(/(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*(\d{4})?/i)){d=new Date(+(m[3]||new Date().getFullYear()),MON[m[2].toLowerCase()],+m[1])}
    l=l.replace(/\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{2,4}/g," ").replace(/\b\d{1,2}\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(\s*\d{4})?/gi," ").replace(/(\d)\.\s+(\d)/g,"$1.$2");
    let p=null,pm=l.match(/£\s*(\d[\d,]*(?:\.\d{1,2})?)/);
    if(pm)p=parseFloat(pm[1].replace(/,/g,""));
    else{const all=(l.replace(/,(?=\d{3}\b)/g,"").match(/\d+(?:\.\d+)?/g)||[]).map(Number);const dec=all.find(x=>!Number.isInteger(x));p=dec!=null?dec:(all.length===1?all[0]:null)}
    if(p!=null&&p>0&&p<100000)rows.push({p,d:d&&!isNaN(d)?d:null});else bad.push(raw.trim());
  });
  return{rows,bad};
}

function money(){
  const r=S.rules,I=S.items;
  const hold=I.filter(i=>HOLD.includes(i.status)),done=I.filter(i=>DONE.includes(i.status)),watch=I.filter(i=>PRE.includes(i.status));
  const committed=hold.reduce((t,i)=>t+(+i.buy||0)+(+i.pack||0),0);
  const realised=done.reduce((t,i)=>t+(+i.profit||0),0);
  const spent=done.reduce((t,i)=>t+(+i.buy||0)+(+i.pack||0),0);
  const days=done.filter(i=>i.boughtOn&&i.soldOn).map(i=>(new Date(i.soldOn)-new Date(i.boughtOn))/864e5);
  const errs=done.filter(i=>i.expProfit!=null&&i.profit!=null).map(i=>i.profit-i.expProfit);
  const stale=hold.filter(i=>i.boughtOn&&(Date.now()-new Date(i.boughtOn))/864e5>r.staleDays).length;
  return{committed,realised,hold,done,watch,stale,watchTotal:watch.reduce((t,i)=>t+(+i.buy||0),0),
    cash:r.budget+realised-committed,
    avgDays:days.length?days.reduce((a,b)=>a+b,0)/days.length:null,
    roi:spent>0?realised/spent*100:null,
    err:errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:null,nErr:errs.length};
}

/* most you can pay and still pass every rule */
function maxPay(med,cons,post,pack,withMoney){
  const r=S.rules,N=med-fee(med)-post-pack,k=r.minRoi/100;
  let m=Math.min(N-r.minProfit,(N-k*pack)/(1+k),cons-fee(cons)-post-pack-0.01);
  if(r.maxPrice>0)m=Math.min(m,r.maxPrice);
  if(withMoney){const mo=money();m=Math.min(m,mo.cash,r.maxStock-mo.committed-pack)}
  return Math.floor(m*100)/100;
}

function evaluate(f){
  const r=S.rules,{rows,bad}=parse(f.sp),prices=rows.map(x=>x.p);
  if(!prices.length)return{bad,empty:true};
  const hasBuy=String(f.b).trim()!=="",buy=num(f.b),post=num(f.p),pack=num(f.k),active=num(f.a);
  const med=median(prices),avg=prices.reduce((a,b)=>a+b,0)/prices.length,cons=pct(prices,.25);
  const outl=prices.filter(x=>x>med*1.5||x<med*.5).length;
  const prof=x=>x-buy-fee(x)-post-pack;
  const p=prof(med),pc=prof(cons),inv=buy+pack,roi=inv>0?p/inv*100:0;
  let conf="Low";if(prices.length>=10&&outl<=prices.length*.2)conf="High";else if(prices.length>=r.minSales&&outl<=prices.length*.3)conf="Medium";
  const dated=rows.filter(x=>x.d);let freq="";
  if(dated.length>=2){const ts=dated.map(x=>+x.d),span=Math.max(1,(Math.max(...ts)-Math.min(...ts))/864e5);freq=`About ${(dated.length/span*30).toFixed(1)} sales per 30 days (from ${dated.length} dated sales)`}
  const st=active>0?prices.length/(prices.length+active)*100:null;
  const m=money(),mp=maxPay(med,cons,post,pack,true);
  const data=[[prices.length>=r.minSales,`${prices.length} sold prices (you want at least ${r.minSales})`],[conf!=="Low",conf==="Low"?"Sold prices vary a lot or there are too few":"Sold prices are consistent enough to trust"]];
  const buyC=hasBuy?[
    [p>=r.minProfit,`Profit ${gbp(p)} (you want at least ${gbp(r.minProfit)})`],
    [roi>=r.minRoi,`Return ${roi.toFixed(0)}% on your money (you want at least ${r.minRoi}%)`],
    [pc>0,`Still profitable if it sells at the low end (${gbp(pc)})`],
    ...(r.maxPrice>0?[[buy<=r.maxPrice,`Price ${gbp(buy)} is under your overall limit of ${gbp(r.maxPrice)}`]]:[]),
    [m.cash>=buy,`You have ${gbp(m.cash)} available to spend`],
    [m.committed+inv<=r.maxStock,`Money in unsold stock stays under ${gbp(r.maxStock)} (would be ${gbp(m.committed+inv)})`]]:[];
  const checks=[...buyC,...data];
  const score=hasBuy?Math.round(Math.max(0,Math.min(40,p/Math.max(1,r.minProfit)*20))+Math.max(0,Math.min(20,roi/Math.max(1,r.minRoi)*10))+(conf==="High"?20:conf==="Medium"?10:0)+(st==null?0:Math.min(20,st/3))):null;
  return{hasBuy,buy,post,pack,med,avg,cons,count:prices.length,outl,p,pc,roi,conf,checks,pass:checks.every(c=>c[0]),fee:fee(med),min:Math.min(...prices),max:Math.max(...prices),freq,st,score,maxBuy:mp,bad};
}

function buildCT(rows){const t={"0":{n:"All categories",p:null,c:[]}};rows.forEach(r=>{t[r[0]]={n:r[1],p:r[2],c:[]}});rows.forEach(r=>{const par=t[r[2]];if(par)par.c.push(r[0])});return t}
function loadCats(force){
  if(CT&&!force)return Promise.resolve(CT);
  if(!force){try{const x=JSON.parse(localStorage.getItem(CKEY)||"null");if(x&&x.rows&&Date.now()-x.at<30*864e5){CT=buildCT(x.rows);return Promise.resolve(CT)}}catch(e){}}
  const s=S.set;if(!s.url||!s.key)return Promise.reject(new Error("noconn"));
  if(CTload)return CTload;
  CTload=fetch(`${s.url}?key=${encodeURIComponent(s.key)}&tree=1`).then(async r=>{
    if(r.status===401)throw new Error("wrong key");if(!r.ok)throw new Error("error "+r.status);
    const d=await r.json();if(d.error)throw new Error(d.error);
    const rows=[];(function walk(node,parent){(node.childCategoryTreeNodes||[]).forEach(ch=>{rows.push([ch.category.categoryId,ch.category.categoryName,parent]);walk(ch,ch.category.categoryId)})})(d.rootCategoryNode,"0");
    if(!rows.length)throw new Error("empty category list");
    try{localStorage.setItem(CKEY,JSON.stringify({at:Date.now(),rows}))}catch(e){}
    CT=buildCT(rows);return CT}).finally(()=>{CTload=null});
  return CTload;
}

async function backup(){
  const t=JSON.stringify(S);
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(t);toast("Backup copied. Paste it into a private note.")}catch(e){openSheet(`<h2 style="margin-top:0">Your backup</h2><div class="mu">Long-press, Select all, Copy, then paste into a private note.</div><textarea readonly style="min-height:200px">${esc(t)}</textarea><button onclick="closeSheet()">Done</button>`)}
}
function restoreSheet(){openSheet(`<h2 style="margin-top:0">Restore a backup</h2><div class="mu">Paste your backup text. This replaces everything in the app.</div><textarea id="imp" style="min-height:160px"></textarea><div class="btns"><button onclick="restore()">Restore</button><button class="s" onclick="closeSheet()">Cancel</button></div>`)}
function restore(){
  try{const raw=$("imp").value,txt=raw.slice(raw.indexOf("{"),raw.lastIndexOf("}")+1),x=JSON.parse(txt);if(!x.rules||!Array.isArray(x.items))throw 0;

/* ---------- SCAN ---------- */
function prodMax(b){return maxPay(b.med,b.cons,b.post,b.pack,false)}
function untrack(id){const ix=S.base.findIndex(b=>b.id===id);if(ix<0)return;const [b]=S.base.splice(ix,1);save();render();toast("Stopped tracking.","Undo",()=>{S.base.splice(ix,0,b);save();render()})}
async function runScan(list,label){
  const s=S.set,r=S.rules;list=Array.isArray(list)?list:S.base;
  if(!s.url||!s.key){go("settings");toast("Add the Scan connection under Advanced.");return}
  if(!list.length){toast("Track an item first: Check it, then tap Track for Scan.");return}
  SC={res:[],busy:true,msg:"",prog:"",label:label||""};render();
  const out=[],errs=[];let n=0;
  for(const b of list){
    n++;SC.prog=`Scanning ${n} of ${list.length}: ${b.name}`;const pe=$("prog");if(pe)pe.textContent=SC.prog;
    try{
      const lim=prodMax(b);if(lim<=0){errs.push(b.name+": no price passes your rules");continue}
      const res=await fetch(`${s.url}?key=${encodeURIComponent(s.key)}&q=${encodeURIComponent(b.q)}&max=${Math.ceil(lim)}&region=${s.region||"uk"}${b.cat?"&cat="+b.cat:""}`);
      if(res.status===401)throw new Error("wrong key (check Settings)");
      if(!res.ok)throw new Error("service error "+res.status);
      const d=await res.json();if(d.error)throw new Error(d.error);
      const ex=(b.x||"").toLowerCase().split(/[,]+/).map(w=>w.trim()).filter(Boolean);
      const need=b.q.toLowerCase().split(/\s+/).filter(Boolean),nz=w=>w.replace(/[^a-z0-9]/g,"");
      for(const l of d.items||[]){
        const t=(l.title||"").toLowerCase(),tz=nz(t);
        if(!need.every(w=>t.includes(w)||tz.includes(nz(w))))continue;
        if(ex.some(w=>t.includes(w)))continue;
        if(/parts|not working/i.test(l.cond||"")&&!/faulty|incomplete/i.test(b.cond||""))continue;
        const buy=(+l.price||0)+(+l.ship||0);if(buy>lim||buy<b.med*r.minPct/100)continue;
        const p=b.med-fee(b.med)-b.post-b.pack-buy,pc=b.cons-fee(b.cons)-b.post-b.pack-buy,roi=(buy+b.pack)>0?p/(buy+b.pack)*100:0;
        out.push({...l,buy,p,pc,roi,b,lim});
      }
    }catch(e){errs.push(b.name+": "+(e.message==="Failed to fetch"?"no connection":e.message))}
  }
  out.sort((a,b)=>b.p-a.p);
  SC={res:out,busy:false,msg:errs.join(" · "),at:new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),prog:"",label:label||"",list:label?list:null};render();
}
function addScan(i){
  const l=SC.res[i],b=l.b,r=S.rules;
  S.items.unshift({id:Date.now(),url:l.url||"",f:{...BLANK,n:l.title,b:String(l.buy.toFixed(2)),p:String(b.post),k:String(b.pack),c:b.cond||"Used",sp:b.sp||"",q:b.q,x:b.x||"",cat:b.cat||"",catName:b.catName||""},name:l.title,cond:l.cond||b.cond||"",status:"Considered",buy:l.buy,pack:b.pack,outPost:b.post,exp:b.med,expProfit:l.p,conf:b.conf,maxBuy:l.lim,score:Math.round(Math.min(40,l.p/Math.max(1,r.minProfit)*20)+Math.min(20,l.roi/Math.max(1,r.minRoi)*10)+(b.conf==="High"?20:b.conf==="Medium"?10:0)),boughtOn:""});
  save();toast("Saved to Deals.","View",()=>go("deals"));
}
function vScan(){
  const ready=S.set.url&&S.set.key;

   ${ready?`<button onclick="runScan()" ${SC.busy||!S.base.length?"disabled":""}>${SC.busy&&!SC.label?"Scanning…":"Scan all tracked items"}</button><div id="prog" class="mu" style="margin-top:8px">${esc(SC.prog||"")}</div>`
   :`<div class="hint warn" style="margin-top:8px">Scan isn't connected yet.</div><button class="s" onclick="go('settings')">Open Settings</button>`}</div>`;

  if(SC.res&&!SC.busy){

    h+=SC.res.map((l,i)=>{const hr=l.end?new Date(l.end).getHours():null;
     return`<div class="card"><b>${esc(l.title)}</b>
     <div style="margin:6px 0"><span class="chip">${l.auction?"Auction":"Buy It Now"}</span> <span class="chip">${esc(l.cond||"")}</span>${l.loc&&l.loc!=="GB"?` <span class="chip warn">Ships from ${esc(l.loc)}</span>`:""}${hr!==null&&hr<6?` <span class="chip warn">Ends overnight</span>`:""}</div>
     <div class="stat ok">${gbp(l.p)} profit</div>
     <div class="mu">${l.auction?`Current bid ${gbp(l.buy)} incl. ${gbp(l.ship||0)} postage. <b>Bid up to ${gbp(Math.max(0,l.lim-(+l.ship||0)))}</b>.`:`Costs ${gbp(l.buy)} incl. ${gbp(l.ship||0)} postage.`} Return ${l.roi.toFixed(0)}%.</div>
     <div class="mu">Compared with ${l.b.count} sold prices saved ${l.b.on} (${l.b.conf} confidence)</div>
     <div class="btns"><a href="${esc(ukUrl(l.url))}" target="_blank" rel="noopener"><button>Open on eBay</button></a><button class="s" onclick="addScan(${i})">Save to Deals</button></div></div>`}).join("");
  }
  h+=`<div class="card"><b>Tracked items</b>`+(S.base.length?S.base.map(b=>`<div style="padding:10px 0;border-top:1px solid var(--bd);margin-top:8px"><div><b>${esc(b.name)}</b></div><div class="mu">Pays up to <span class="ok" style="font-weight:700">${gbp(prodMax(b))}</span> · typical sold ${gbp(b.med)} · prices from ${b.on}</div><div class="mu">Category: ${b.cat?esc(b.catName):`<span class="warn">any (may show accessories)</span>`}</div><div class="btns"><button class="s" style="min-height:40px;padding:8px 14px;margin-top:8px" onclick="pickCat(${b.id})">${b.cat?"Change category":"Set category"}</button><button class="d" style="min-height:40px;padding:8px 14px;margin-top:8px" onclick="untrack(${b.id})">Stop tracking</button></div></div>`).join(""):`<div class="mu" style="margin-top:6px">Nothing tracked yet. Check an item, then tap <b>Track for Scan</b>.</div><button class="s" onclick="go('book')">Check an item</button>`)+`</div>`;
  return h;
}

const HDEF={cats:[],types:{bin:true,auction:true,misspelt:true,spares:false},alerts:false,interval:10,alertScore:70,minScore:40,post:5,pack:1,bpf:true,paused:false};
let HD={deals:null,report:null,learned:[],busy:false,err:"",filter:"all",at:0,q:"",sort:(()=>{try{return localStorage.getItem("flipscout_sort")||"score"}catch(e){return"score"}})()},FL={list:null,busy:false,err:""},DV=null;

const api=(q,body)=>fetch(`${S.set.url}?key=${encodeURIComponent(S.set.key)}&${q}`,body!==undefined?{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)}:{}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||("error "+r.status));return d});

let pcT=null;
function pushConfig(now){clearTimeout(pcT);const go_=async()=>{if(!connected())return;const h=H(),r=S.rules;
  try{await api("config=1",{cats:h.cats,types:h.types,alerts:!!h.alerts,interval:h.interval,paused:h.paused,region:S.set.region,

  catch(e){toast("Couldn't save hunting settings: "+errText(e))}};
  if(now)return go_();pcT=setTimeout(go_,800)}
async function loadDeals(){if(!connected()||HD.busy)return;HD.busy=true;HD.err="";
  try{const d=await api("deals=1");HD.deals=d.deals||[];HD.report=d.report;HD.learned=d.learned||[];HD.close=d.close||[];HD.learning=d.learning||null;HD.at=Date.now()}catch(e){HD.err=errText(e)}

async function huntNow(){if(HD.busy)return;if(!H().cats.length){go("cats");toast("Pick some categories first.");return}

  catch(e){HD.busy=false;HD.err=errText(e);render()}}
const ago=ts=>{if(!ts)return"";const m=Math.round((Date.now()-ts)/60000);return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
const left=ts=>{if(!ts)return"";const m=Math.round((ts-Date.now())/60000);if(m<=0)return"ended";if(m<60)return m+" min left";const h=Math.floor(m/60);return h<48?`${h}h ${m%60}m left`:Math.round(h/24)+" days left"};
const ring=(sc,big)=>{const c=sc>=70?"var(--ok)":sc>=50?"var(--warn)":"var(--bad)",s=big?60:36;return`<span style="display:inline-grid;place-items:center;width:${s}px;height:${s}px;border-radius:50%;border:${big?5:3}px solid ${c};font-weight:800;font-size:${big?20:13}px">${sc}</span>`};

function dealBadge(d){if(d.kind==="spares")return`<span class="chip warn">Spares or repairs</span>`;
  if(d.type==="AUC")return`<span class="chip warn">Auction · ${left(d.end)}</span>`;
  return`<span class="chip ok">Buy It Now${d.created?" · listed "+ago(d.created):""}</span>`}
// The three numbers a reseller judges by: eBay's price, the most to pay, and profit after fees
function priceRow(d){
  const auc=d.type==="AUC",bo=!auc&&d.bestOffer,mx=d.maxItem!=null?d.maxItem:auc?d.maxBid:null;

  const at=auc?f.max:(f.price||0),pay=at+(f.ship||0)+(h.bpf?bpfA(at):0),prof=f.med?f.med-fee(f.med)-out-pay:null;
  const cell=(l,v,n,c)=>`<div style="min-width:0"><div class="mu" style="font-size:12px">${l}</div><div class="stat ${c||""}" style="font-size:19px;line-height:1.25">${v}</div>${n?`<div class="mu" style="font-size:12px">${n}</div>`:""}</div>`;
  return`<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--card2)">
   ${cell(auc?"eBay bid now":"eBay price",gbp(f.price||0),f.ship?"+ "+gbp(f.ship)+" post":"free post")}
   ${cell(auc?"Your max bid":"Your max",gbp(f.max),auc?"":"incl. postage","ok")}
   ${cell("Profit",prof==null?"—":(prof>=0?"+":"−")+gbp(Math.abs(prof)),prof==null?"price not known":auc?"after fees, if you win at max":"after fees, at this price",prof==null?"":prof>0?"ok":"bad")}</div>`}
function vFollow(){
  if(connected()&&FL.list===null&&!FL.busy&&!FL.err)setTimeout(loadFollows,0);
  const L=FL.list||[];
  const state=f=>{const total=(f.price||0)+(f.ship||0),ended=f.status!=="live",now=f.type==="AUC"?(f.price||0):total,under=now<=f.max;
    return{ended,now,under,txt:ended?(f.type==="AUC"&&now>f.max?"Went over your max":"Ended"):under?"Under your max":f.type==="AUC"?"Above your max":"Waiting for a drop",cls:ended?"bad":under?"ok":"warn"}};
  const live=L.filter(f=>f.status==="live"),done=L.filter(f=>f.status!=="live");
  const fcard=f=>{const s=state(f),gap=s.now-f.max;
    return`<div class="card"${s.ended?' style="opacity:.7"':""}>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="chip ${s.cls}">${s.txt}</span><span class="mu" style="font-size:13px">${f.type==="AUC"?"Auction"+(f.end&&!s.ended?" · "+left(f.end):""):"Buy It Now"}</span></div>
    <div style="display:flex;gap:12px;margin-top:10px">${f.img?`<img src="${esc(f.img)}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:12px;flex:none;background:var(--card2)" loading="lazy">`:`<div style="width:72px;height:72px;border-radius:12px;flex:none;background:var(--card2);display:grid;place-items:center;color:var(--mu)">${I.bell}</div>`}
     <div style="min-width:0"><div style="font-weight:700;line-height:1.3">${esc(f.title)}</div><div class="mu">${esc(f.cond||"")}${f.med?(f.cond?" · ":"")+"worth about "+gbp(f.med):""}</div></div></div>
    ${followRow(f,s)}
    ${s.ended?"":`<div class="mu" style="margin-top:4px;font-size:13px">${gap>0?`${gbp(gap)} above your max`:`${gbp(-gap)} under your max`}${f.type==="AUC"?" · put "+gbp(f.max)+" as your max bid and eBay bids for you":""}</div>`}
    <div class="btns">${s.ended?"":`<a href="${esc(ukUrl(f.url))}" target="_blank" rel="noopener"><button>${f.type==="AUC"?"Bid on eBay":"Open on eBay"}</button></a><button class="s" onclick="changeMax('${f.id}')">Change max</button>`}<button class="s" onclick="unfollow('${f.id}')">Remove</button></div></div>`};
  return`<h2>Following</h2>
  ${connected()?`<div class="hint" style="margin:-6px 4px 12px">${H().alerts&&PUSH.registered?"You'll get an alert when one hits your price or is about to end.":"<span class='warn'>Phone alerts are off.</span> <a href='#' onclick=\"go('settings');return false\">Turn them on</a>"}</div>`:""}
  ${!connected()?`<div class="card empty">${I.bell}<b>Connect your Scan service</b><div class="mu">Following needs your Scan service. It watches listings for you and alerts you.</div><button onclick="goConnect()">Connect now</button></div>`:""}
  ${FL.err?`<div class="card bad">${esc(FL.err)}</div>`:""}
  ${FL.list===null&&connected()?`<div class="card mu">Loading…</div>`:""}
  ${live.map(fcard).join("")}
  ${!L.length&&FL.list!==null?`<div class="card empty">${I.bell}<b>Not following anything yet</b><div class="mu">Open a deal and tap <b>Follow</b>, then set the most you'd pay. FlipScout watches it and alerts you.</div><button onclick="go('deals')">See today's deals</button></div>`:""}
  ${done.length?`<h3 style="margin:18px 4px 6px">Ended</h3>`+done.map(fcard).join(""):""}`;
}
/* My categories */
function vCats(){
  const h=H(),lr={};(HD.learned||[]).forEach(x=>lr[x.cat]=x.n);
  if(!connected())return`<h2>My categories</h2><div class="card">Connect your Scan service first.</div><button onclick="goConnect()">Connect now</button>`;
  setTimeout(()=>{CAT.h=CAT.h||"";drawCat("h")},0);
  const cb=(k,label)=>`<label class="chkrow" style="min-height:44px;margin:4px 0"><input type="checkbox" ${h.types[k]?"checked":""} onchange="H().types.${k}=this.checked;save();pushConfig()"><span>${label}</span></label>`;
  return`<h2>My categories</h2><div class="mu" style="margin:-6px 4px 12px">FlipScout hunts in these for you, around the clock.</div>${starterLeft()&&h.cats.length<15?`<div class="card"><b>Popular for flipping</b><div class="mu">${STARTER.map(x=>x[1]).join(", ")}. FlipScout knows these model by model, so it finds real deals fastest.</div><button onclick="addStarter()">Add popular categories</button></div>`:""}
  ${h.cats.map((c,i)=>`<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><b>${esc(c.name)}</b><div class="mu">${esc(c.path||"")}</div><div class="hint ${lr[c.id]?"ok":"warn"}" style="margin-top:4px">${lr[c.id]?lr[c.id]+" sales learned":"Learning prices… (first deals usually within a day or two)"}</div></div><button class="d" style="margin:0;min-height:40px;padding:8px 12px" onclick="rmCat(${i})" aria-label="Remove ${esc(c.name)}">Remove</button></div>`).join("")||`<div class="card mu">No categories yet. Add one below.</div>`}
  <div class="card" style="border-style:dashed"><b>Add a category</b><div id="catbox_h" style="margin-top:10px"></div>
   <button style="width:100%" onclick="addCat()" ${h.cats.length>=15?"disabled":""}>Add this category</button><div class="hint">Pick down to the most specific category you know (e.g. Graphics/Video Cards). Up to 15. More categories means each is checked a little less often.</div></div>
  <div class="card"><b>What to hunt for</b>
   ${cb("bin","Buy It Now listings below their value")}
   ${cb("auction","Auctions ending soon you can win cheaply")}
   ${cb("misspelt","Misspelt titles (fewer people find them)")}
   ${cb("spares","Spares or repairs (shows what the seller says, you judge it)")}
   <div class="row"><div><label for="hm">Minimum score</label><select id="hm" onchange="H().minScore=+this.value;save();pushConfig()">${[[30,"Any (30+)"],[50,"Medium (50+)"],[70,"High only (70+)"]].map(o=>`<option value="${o[0]}"${h.minScore===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select></div>
   <div><label for="hi">Check every</label><select id="hi" onchange="H().interval=+this.value;save();pushConfig()">${[5,10,15,30,60].map(m=>`<option value="${m}"${h.interval===m?" selected":""}>${m} minutes</option>`).join("")}</select></div></div>
   <div class="hint">Minimum profit and return come from Settings › Your buying rules (now ${gbp(S.rules.minProfit)} and ${S.rules.minRoi}%).</div>
   <label class="chkrow" style="min-height:44px"><input type="checkbox" ${h.paused?"checked":""} onchange="H().paused=this.checked;save();pushConfig()"><span>Pause hunting</span></label></div>`;
}
// Popular flip categories FlipScout already knows how to match model-by-model (UK category numbers)
const STARTER=[["27386","Graphics Cards"],["139971","Video Game Consoles"],["9355","Mobile & Smart Phones"],["171485","Tablets & eBook Readers"],["177","PC Laptops & Netbooks"],["164","CPUs/Processors"],["80053","Monitors"],["170083","Memory (RAM)"],["175669","Solid State Drives"]];
async function addStarter(){const h=H();try{await loadCats()}catch(e){}
  let n=0;STARTER.forEach(([id,nm])=>{if(h.cats.length>=15||h.cats.some(c=>c.id===id))return;if(CT&&!CT[id])return;
    h.cats.push({id,name:CT&&CT[id]?CT[id].n:nm,path:CT&&CT[id]?catPathOf(id):""});n++});
  save();pushConfig(true);render();toast(n?`Added ${n} popular categor${n>1?"ies":"y"}. FlipScout starts hunting now.`:"You already have these.")}
const starterLeft=()=>STARTER.filter(([id])=>!H().cats.some(c=>c.id===id)).length;
function addCat(){const id=CAT.h;if(!id||!CT||!CT[id]){toast("Pick a category first.");return}const h=H();
  if(h.cats.some(c=>c.id===id)){toast("Already in your list.");return}
  h.cats.push({id,name:CT[id].n,path:catPathOf(id)});CAT.h="";save();pushConfig(true);render();toast(`Hunting in ${CT[id].n}.`)}
function rmCat(i){const h=H(),[c]=h.cats.splice(i,1);save();pushConfig();render();toast("Removed.","Undo",()=>{h.cats.splice(i,0,c);save();pushConfig();render()})}
/* alerts */
/* FlipScout's own push notifications (Firebase via the Capacitor plugin) */
const PN=()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.PushNotifications;
const PUSH={native:!!PN(),registered:false,err:"",token:""};
let pushReady=false;
function pushListeners(){const P=PN();if(!P||pushReady)return;pushReady=true;
  try{P.createChannel({id:"deals",name:"Deals and price alerts",description:"New deals and followed listings",importance:5,visibility:1,vibration:true})}catch(e){}
  P.addListener("registration",async t=>{PUSH.token=t.value;PUSH.err="";
    try{const r=await api("device=1",{token:t.value,name:"Android"});PUSH.registered=true;if(!r.ready)PUSH.err="Your service still needs its alert key. Finish the Firebase setup steps."}catch(e){PUSH.err="Couldn't register this phone: "+errText(e)}
    if(tab==="settings"||tab==="follow")render()});
  P.addListener("registrationError",e=>{PUSH.err="This phone couldn't register for alerts ("+((e&&e.error)||"unknown")+").";if(tab==="settings")render()});
  P.addListener("pushNotificationReceived",n=>{toast((n.title||"FlipScout")+": "+(n.body||""),"View",()=>openPushed(n.data||{}))});
  P.addListener("pushNotificationActionPerformed",a=>openPushed((a.notification&&a.notification.data)||{}));
}
function openPushed(d){if(d.kind==="follow"){FL.list=null;go("follow");return}
  HD.deals=null;go("deals");loadDeals().then(()=>{const i=(HD.deals||[]).findIndex(x=>x.id===d.id);if(i>=0)openDeal(i)})}
async function enableAlerts(){const P=PN();if(!P){toast("Alerts work in the installed app.");return}
  pushListeners();PUSH.err="";
  try{let st=await P.checkPermissions();if(st.receive!=="granted")st=await P.requestPermissions();
    if(st.receive!=="granted"){PUSH.err="Notifications are blocked. Allow them for FlipScout in your phone's Settings › Apps › FlipScout › Notifications.";render();return}
    H().alerts=true;save();pushConfig();await P.register();toast("Setting up alerts…")}
  catch(e){PUSH.err="Couldn't turn on alerts: "+(e.message||e);render()}}
async function autoPush(){const P=PN();if(!P||!connected()||!H().alerts)return;pushListeners();
  try{const st=await P.checkPermissions();if(st.receive==="granted")await P.register()}catch(e){}}
async function testAlert(){try{await api("test=1");toast("Test alert sent. It should pop up in a few seconds.")}catch(e){toast("Couldn't send: "+errText(e))}}

/* ---------- WELCOME ---------- */
const OB=[
 ["logo","Your 24/7 bargain hunter","Pick the eBay categories you know. FlipScout checks them every few minutes and finds listings priced below what they sell for."],
 ["bolt","Only real deals","Every deal shows your profit after fees and a score with its reasons. Tap Check sold prices to see what it really sells for. A scam shield hides risky listings."],
 ["bell","Follow and get alerts","Set the most you'd pay. Your phone pings when a deal appears or a followed listing drops to your price."],
 ["stock","Then sell it","Track each item from bought to sold, with your real profit and cash in the Money tab."],
 ["seller","How do you sell on eBay?","This sets your fees so the profit figures are right. You can change it later in Settings."]];
function showOnb(){$("onb").style.display="flex";renderOnb()}
function renderOnb(){
  const s=OB[ob],last=ob===OB.length-1,logo=document.querySelector(".brand img").src;
  $("onb").innerHTML=`<div style="text-align:right">${last?"":`<button class="link" onclick="finishOnb()">Skip</button>`}</div>
  <div class="art">${s[0]==="logo"?`<img src="${logo}" alt="">`:s[0]==="seller"?"":I[s[0]]}<h1>${s[1]}</h1><p>${s[2]}</p>
  ${last?`<div style="width:100%;margin-top:14px"><button class="choice ${S.rules.seller==="private"?"on":""}" onclick="S.rules.seller='private';save();renderOnb()">Private seller<small>Selling my own things now and then</small></button><button class="choice ${S.rules.seller!=="private"?"on":""}" onclick="S.rules.seller='business';save();renderOnb()">Business seller<small>Buying to resell regularly</small></button></div>`:""}</div>
  <div class="dots">${OB.map((_,i)=>`<i class="${i===ob?"on":""}"></i>`).join("")}</div>
  ${last?`<button style="width:100%;margin:0" onclick="finishOnb()">Start using FlipScout</button>`
  :`<button style="width:100%;margin:0" onclick="ob++;renderOnb()">Next</button>`}`;
}
function finishOnb(){try{localStorage.setItem(OKEY,"1")}catch(e){}$("onb").style.display="none";tab="deals";prev=[];render()}

H();render();
autoPush();
try{if(!localStorage.getItem(OKEY))showOnb()}catch(e){}
// offer to restore a cloud backup once, on a fresh install, never on every open
(()=>{let asked=false;try{asked=!!localStorage.getItem("flipscout_restore_asked")}catch(e){}
  if(!asked&&connected()&&!S.items.length&&!S.base.length){try{localStorage.setItem("flipscout_restore_asked","1")}catch(e){}cloudCheck(true)}})();
</script>
